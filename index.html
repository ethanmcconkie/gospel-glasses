<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="description" content="A scripture study companion for Meta Ray-Ban Display glasses">
<meta name="mrbd-web-app-capable" content="yes">
<meta property="og:image" content="https://ethanmcconkie.github.io/gospel-glasses/icon.png">
<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">
<meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
<link rel="icon" href="icon-96.png" sizes="96x96">
<link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<title>Bookshelf</title>
<style>
:root {
  --bg:        #000;
  --surface:   rgba(12,14,20,0.82);
  --card:      rgba(255,255,255,0.052);
  --card-hi:   rgba(201,168,76,0.11);
  --ink:       #F0EBE0;
  --ink-dim:   rgba(240,235,224,0.38);
  --ink-mid:   rgba(240,235,224,0.62);
  --gold:      #C9A84C;
  --gold-b:    rgba(201,168,76,0.45);
  --gold-glow: rgba(201,168,76,0.18);
  --divider:   rgba(255,255,255,0.06);
  --scrim:     rgba(0,0,0,0.92);
  --font:      'Noto Serif', Georgia, serif;
  --ease:      cubic-bezier(0.4,0,0.2,1);
  --ease-out:  cubic-bezier(0,0,0.2,1);
}

*,::before,::after { box-sizing:border-box; margin:0; padding:0; }

html, body {
  width:600px; height:600px;
  background:var(--bg); color:var(--ink);
  overflow:hidden; font-family:var(--font);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

#app { position:relative; width:600px; height:600px; }

/* ═══════════════════════════════════════
   Screen transitions
═══════════════════════════════════════ */
.screen {
  position:absolute; inset:0;
  display:flex; flex-direction:column;
  padding:36px 28px 20px;
  opacity:0; visibility:hidden; pointer-events:none;
  transform:translateY(10px);
  transition:
    opacity 240ms var(--ease),
    transform 240ms var(--ease),
    visibility 0s 240ms;
}
.screen.active {
  opacity:1; visibility:visible; pointer-events:auto;
  transform:translateY(0);
  transition:
    opacity 240ms var(--ease),
    transform 240ms var(--ease),
    visibility 0s 0s;
}

/* ═══════════════════════════════════════
   BOOT SCREEN — Book flipping pages
═══════════════════════════════════════ */
#boot {
  justify-content:center; align-items:center;
  gap:44px; padding:0;
}
.boot-status { display:none; }
.boot-error {
  font-size:12px; color:#FF7B7B;
  max-width:440px; text-align:center; line-height:1.6;
}

/* ── 3-D book scene ── */
.book-scene {
  perspective:740px;
  perspective-origin:50% 36%;
}
.book-wrap {
  position:relative; width:240px; height:158px;
  transform:rotateX(32deg) rotateY(-6deg);
  transform-style:preserve-3d;
}

/* Left cover — read side, navy */
.book-left {
  position:absolute; left:0; top:0; width:112px; height:158px;
  background:linear-gradient(to right,#03060D 0%,#091422 60%,#101E30 100%);
  border-radius:5px 0 0 5px; z-index:20;
}
.book-left::after {
  content:''; position:absolute;
  top:20px; bottom:20px; right:0; width:1px;
  background:linear-gradient(to bottom,transparent,rgba(201,168,76,0.32) 28%,rgba(201,168,76,0.32) 72%,transparent);
}

/* Spine */
.book-spine {
  position:absolute; left:112px; top:0; width:16px; height:158px;
  background:linear-gradient(to right,#020406 0%,#050A12 42%,#020406 100%);
  z-index:30;
}
.book-spine::after {
  content:''; position:absolute;
  top:16px; bottom:16px; left:50%; width:1px;
  transform:translateX(-50%);
  background:linear-gradient(to bottom,transparent,var(--gold) 24%,var(--gold) 76%,transparent);
  opacity:0.40;
}

/* Right cover — unread side, cream paper */
.book-right {
  position:absolute; right:0; top:0; width:112px; height:158px;
  background:linear-gradient(to left,#D4D0C4 0%,#ECEADF 55%,#F2EFE7 100%);
  border-radius:0 5px 5px 0; z-index:1;
}
/* subtle page-edge lines on unread stack */
.book-right::before {
  content:''; position:absolute; inset:0;
  background:repeating-linear-gradient(
    to bottom,
    transparent 0, transparent 9px,
    rgba(0,0,0,0.032) 9px, rgba(0,0,0,0.032) 10px
  );
  border-radius:0 5px 5px 0;
}

/* Flipping page */
.book-page {
  position:absolute; left:128px; top:3px;
  width:106px; height:152px;
  transform-origin:left center;
  transform-style:preserve-3d;
  animation:pgFlip 2.4s cubic-bezier(0.42,0,0.28,1) infinite;
  animation-delay:calc(var(--n) * 0.48s);
  z-index:15;
}
.pg-f, .pg-b { position:absolute; inset:0; }

/* Front face — cream, with line texture */
.pg-f {
  background:linear-gradient(to right,#C4C0B2 0%,#E6E3D8 32%,#F0EDE5 100%);
  border-radius:0 4px 4px 0;
  backface-visibility:hidden;
}
.pg-f::after {
  content:''; position:absolute;
  left:14px; right:12px; top:20px; bottom:20px;
  background:repeating-linear-gradient(
    to bottom,
    rgba(28,20,6,0.065) 0, rgba(28,20,6,0.065) 1px,
    transparent 1px, transparent 9px
  );
}
/* shadow as page lifts */
.pg-f::before {
  content:''; position:absolute; inset:0;
  background:linear-gradient(to right,rgba(0,0,0,0.12) 0%,transparent 20%);
  border-radius:0 4px 4px 0;
}

/* Back face — navy inside */
.pg-b {
  background:linear-gradient(to left,#060910 0%,#0C1828 100%);
  border-radius:4px 0 0 4px;
  backface-visibility:hidden;
  transform:rotateY(180deg);
}

@keyframes pgFlip {
  0%   { transform:rotateY(0deg); }
  38%  { transform:rotateY(-180deg); }
  100% { transform:rotateY(-180deg); }
}

/* ── Wordmark ── */
.boot-wordmark-wrap {
  display:flex; flex-direction:column;
  align-items:center; gap:10px;
  animation:bootWmFade 1.6s var(--ease-out) 0.7s both;
}
@keyframes bootWmFade {
  from { opacity:0; transform:translateY(7px); }
  to   { opacity:1; transform:translateY(0); }
}
.boot-wordmark-rule {
  width:56px; height:1px;
  background:linear-gradient(to right,transparent,var(--gold),transparent);
  opacity:0.55;
}
.boot-wordmark {
  font-family:var(--font); font-size:19px; font-weight:400;
  letter-spacing:10px; text-transform:uppercase; text-indent:10px;
  color:var(--gold); opacity:0.88;
}
.boot-wordmark-sub {
  font-size:8px; letter-spacing:4px; text-transform:uppercase;
  color:var(--ink-dim); opacity:0.50; text-indent:4px;
  margin-top:-2px;
}

/* ═══════════════════════════════════════
   Back button — refined gold
═══════════════════════════════════════ */
.back-btn {
  display:inline-flex; align-items:center; gap:6px;
  color:var(--gold); cursor:pointer; flex-shrink:0;
  padding:0 0 20px;
  font-size:10px; font-weight:400;
  letter-spacing:2.5px; text-transform:uppercase;
  background:none; border:none; font-family:var(--font);
  opacity:0.7;
  transition:opacity 180ms var(--ease);
}
.back-btn:focus { outline:none; opacity:1; }
.back-chev {
  font-size:16px; line-height:1; opacity:0.85;
  position:relative; top:-0.5px;
}

/* ═══════════════════════════════════════
   Screen titles — authoritative
═══════════════════════════════════════ */
.screen-title {
  font-size:32px; font-weight:600;
  letter-spacing:-0.8px; line-height:1.0;
  color:var(--ink); margin-bottom:22px; flex-shrink:0;
}

/* ═══════════════════════════════════════
   Home screen
═══════════════════════════════════════ */
#home { padding-top:52px; }

.home-label {
  font-size:9px; letter-spacing:4px; text-transform:uppercase;
  color:var(--gold); opacity:0.65; margin-bottom:8px; flex-shrink:0;
}

.home-title {
  font-size:38px; font-weight:600;
  letter-spacing:-1px; line-height:1;
  color:var(--ink); margin-bottom:38px; flex-shrink:0;
}

/* ═══════════════════════════════════════
   Card rows (list items) — Gospel Library feel
═══════════════════════════════════════ */
.card-list {
  flex:1; overflow-y:auto;
  display:flex; flex-direction:column; gap:0;
  -webkit-mask-image:linear-gradient(
    to bottom,
    transparent 0px,
    black 20px,
    black calc(100% - 20px),
    transparent 100%
  );
  mask-image:linear-gradient(
    to bottom,
    transparent 0px,
    black 20px,
    black calc(100% - 20px),
    transparent 100%
  );
  padding:4px 0;
}
.card-list::-webkit-scrollbar { display:none; }

.card-row {
  min-height:60px; flex-shrink:0;
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 18px 14px 20px;
  background:transparent;
  border-radius:0;
  border:none;
  border-bottom:1px solid var(--divider);
  cursor:pointer;
  transition:
    background 180ms var(--ease),
    border-color 180ms var(--ease);
  position:relative; overflow:hidden;
}
.card-row:first-child { border-top:1px solid var(--divider); }

/* Subtle left accent bar — revealed on focus */
.card-row::before {
  content:''; position:absolute;
  left:0; top:12px; bottom:12px; width:2px;
  background:var(--gold);
  border-radius:0 2px 2px 0;
  opacity:0;
  transform:scaleY(0.4);
  transition:opacity 180ms var(--ease), transform 180ms var(--ease);
}
.card-row:focus::before {
  opacity:0.8; transform:scaleY(1);
}

.card-row .label {
  font-size:16px; font-weight:400;
  color:var(--ink); line-height:1.3;
  letter-spacing:0.1px;
}
.card-row .sub {
  font-size:11px; color:var(--ink-dim);
  margin-top:3px; letter-spacing:0.2px;
}
.card-row .chev {
  font-size:18px; color:var(--ink-dim);
  margin-left:12px; flex-shrink:0;
  transition:color 180ms var(--ease), transform 180ms var(--ease);
  font-style:normal; opacity:0.35;
}

.card-row:focus {
  outline:none;
  background:rgba(201,168,76,0.06);
  border-bottom-color:rgba(201,168,76,0.18);
}
.card-row:focus .chev {
  color:var(--gold); opacity:1;
  transform:translateX(3px);
}
.card-row:focus .label { color:var(--ink); }

.card-row.empty { opacity:0.2; pointer-events:none; }

/* ═══════════════════════════════════════
   Volume card grid — Library screen
   Portrait book covers, 4-column
═══════════════════════════════════════ */
.vol-grid {
  display:grid;
  grid-template-columns:repeat(4, 1fr);
  gap:14px 8px;
  overflow-y:auto; flex:1;
  align-content:flex-start;
  -webkit-mask-image:linear-gradient(
    to bottom,
    transparent 0px,
    black 18px,
    black calc(100% - 18px),
    transparent 100%
  );
  mask-image:linear-gradient(
    to bottom,
    transparent 0px,
    black 18px,
    black calc(100% - 18px),
    transparent 100%
  );
  padding:4px 2px 8px;
}
.vol-grid::-webkit-scrollbar { display:none; }

.vol-wrap {
  display:flex; flex-direction:column;
  gap:7px; cursor:pointer;
}
.vol-wrap:focus { outline:none; }
.vol-wrap.empty { opacity:0.2; pointer-events:none; }

.vol-wrap:focus .vol-card {
  transform:scale(1.05) translateY(-4px);
  box-shadow:
    0 0 0 1.5px rgba(201,168,76,0.55),
    0 6px 20px rgba(0,0,0,0.75),
    0 20px 52px rgba(0,0,0,0.9),
    0 0 36px rgba(201,168,76,0.22),
    0 0 64px rgba(201,168,76,0.08);
}
.vol-wrap:focus .vol-label {
  color:var(--gold);
  opacity:1;
}

/* Portrait book cover card — 2:3 ratio */
.vol-card {
  width:100%;
  aspect-ratio:2/3;
  background:var(--cover-bg, #0A0C14);
  border-radius:5px 7px 7px 5px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:14px 10px;
  text-align:center;
  box-shadow:
    -3px 0 6px rgba(0,0,0,0.5),
    0 2px 4px rgba(0,0,0,0.5),
    0 8px 24px rgba(0,0,0,0.75),
    inset 0 1px 0 rgba(255,255,255,0.07),
    inset 0 -1px 0 rgba(0,0,0,0.4);
  transition:
    transform 220ms var(--ease),
    box-shadow 220ms var(--ease);
  position:relative; overflow:hidden;
}

/* Spine shadow on left edge */
.vol-card::after {
  content:''; position:absolute;
  left:0; top:0; bottom:0; width:10px;
  pointer-events:none;
  background:linear-gradient(to right, rgba(0,0,0,0.50), rgba(0,0,0,0.12) 60%, transparent);
  border-radius:5px 0 0 5px;
  z-index:4;
}

/* Diagonal sheen on cover */
.vol-card::before {
  content:''; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(
    148deg,
    rgba(255,255,255,0.09) 0%,
    rgba(255,255,255,0.02) 38%,
    transparent 55%
  );
  z-index:2;
}

/* Cover photo image */
.vol-card-img {
  position:absolute; inset:0;
  width:100%; height:100%;
  object-fit:cover;
  border-radius:inherit;
  z-index:1;
}

/* Fallback content */
.vol-card-fallback {
  position:relative; z-index:3;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  width:100%; height:100%;
  padding:12px 8px;
  gap:0;
}

/* Top ornament rule */
.vol-card-ornament-top {
  width:60%; height:1px;
  background:linear-gradient(to right, transparent, var(--cover-fg, var(--gold)) 40%, var(--cover-fg, var(--gold)) 60%, transparent);
  opacity:0.65;
  margin-bottom:10px;
  flex-shrink:0;
}

/* Bottom ornament rule */
.vol-card-ornament-bot {
  width:60%; height:1px;
  background:linear-gradient(to right, transparent, var(--cover-fg, var(--gold)) 40%, var(--cover-fg, var(--gold)) 60%, transparent);
  opacity:0.65;
  margin-top:10px;
  flex-shrink:0;
}

.vol-card-name {
  font-size:7.5px; font-weight:600;
  letter-spacing:2.2px;
  text-transform:uppercase;
  line-height:2.2;
  color:var(--cover-fg, var(--gold));
  position:relative; z-index:1;
  width:80%;
  text-shadow:0 1px 6px rgba(0,0,0,0.7);
}

.vol-label {
  font-size:9px;
  color:var(--ink-dim);
  text-align:center;
  line-height:1.3;
  letter-spacing:0.2px;
  transition:color 200ms var(--ease), opacity 200ms var(--ease);
  padding:0 2px;
}

/* ═══════════════════════════════════════
   Chapter chip grid — elegant tokens
═══════════════════════════════════════ */
.chip-grid {
  display:flex; flex-wrap:wrap;
  gap:7px; overflow-y:auto; flex:1;
  align-content:flex-start;
  -webkit-mask-image:linear-gradient(
    to bottom,
    transparent 0px,
    black 18px,
    black calc(100% - 18px),
    transparent 100%
  );
  mask-image:linear-gradient(
    to bottom,
    transparent 0px,
    black 18px,
    black calc(100% - 18px),
    transparent 100%
  );
  padding:4px 2px;
}
.chip-grid::-webkit-scrollbar { display:none; }
.chip-grid.list-mode { flex-wrap:nowrap; flex-direction:column; gap:0; }
.chip-grid.list-mode .card-row { width:100%; }

.chip {
  width:62px; height:62px;
  display:flex; align-items:center; justify-content:center;
  font-size:15px; font-weight:400;
  color:var(--ink-mid);
  background:rgba(255,255,255,0.04);
  border-radius:10px;
  border:1px solid rgba(255,255,255,0.05);
  cursor:pointer;
  transition:
    background 180ms var(--ease),
    border-color 180ms var(--ease),
    color 180ms var(--ease),
    box-shadow 180ms var(--ease),
    transform 180ms var(--ease);
  position:relative; overflow:hidden;
  letter-spacing:-0.3px;
}

/* Inner top highlight */
.chip::before {
  content:''; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(to bottom, rgba(255,255,255,0.045) 0%, transparent 55%);
  border-radius:inherit;
}

.chip:focus {
  outline:none;
  color:var(--gold);
  background:rgba(201,168,76,0.08);
  border-color:rgba(201,168,76,0.50);
  transform:scale(1.05);
  box-shadow:
    0 0 0 1px rgba(201,168,76,0.30),
    0 0 20px rgba(201,168,76,0.16),
    inset 0 0 10px rgba(201,168,76,0.05);
}

.chip.empty { opacity:0.2; pointer-events:none; }

/* ═══════════════════════════════════════
   Section labels
═══════════════════════════════════════ */
.section-label {
  font-size:8px; letter-spacing:3.5px; text-transform:uppercase;
  color:var(--gold); opacity:0.55;
  padding:6px 2px 12px;
  flex-shrink:0;
}
.section-label:first-child { padding-top:0; }

.recents-note {
  font-size:14px; color:var(--ink-dim);
  padding:16px 2px; line-height:1.6;
  font-style:italic;
}

/* ═══════════════════════════════════════
   Reader screen
═══════════════════════════════════════ */
#reader { padding:18px 26px 14px; }

.reader-header {
  display:flex; align-items:center; gap:10px;
  padding-bottom:11px;
  border-bottom:1px solid var(--divider);
  flex-shrink:0;
  position:relative;
}

/* Gold accent line under header */
.reader-header::after {
  content:''; position:absolute;
  bottom:-1px; left:0; width:48px; height:1px;
  background:var(--gold); opacity:0.40;
}

/* Ref tag — "Genesis · 1" */
.ref-tag {
  font-size:10px; font-weight:400;
  color:var(--ink-dim); flex:1;
  letter-spacing:1.2px;
  text-transform:uppercase;
  font-style:normal;
}

.verse-counter {
  font-size:9px; color:var(--ink-dim);
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.07);
  padding:3px 10px; border-radius:20px;
  flex-shrink:0; letter-spacing:0.8px;
}

.bookmark-flag    { font-size:14px; color:var(--ink-dim); flex-shrink:0; transition:color 200ms var(--ease), text-shadow 200ms var(--ease); }
.bookmark-flag.on { color:var(--gold); text-shadow:0 0 14px rgba(201,168,76,0.45); }

/* Scrollable verse area */
.chapter-scroll {
  flex:1; overflow-y:auto;
  padding:0 0 24px;
  scrollbar-width:none;
  -webkit-mask-image:linear-gradient(
    to bottom,
    transparent 0px,
    black 22px,
    black calc(100% - 28px),
    transparent 100%
  );
  mask-image:linear-gradient(
    to bottom,
    transparent 0px,
    black 22px,
    black calc(100% - 28px),
    transparent 100%
  );
}
.chapter-scroll::-webkit-scrollbar { display:none; }

/* ═══════════════════════════════════════
   Chapter header — Gospel Library style
═══════════════════════════════════════ */
.chapter-header {
  text-align:center;
  padding:22px 8px 26px;
  display:flex; flex-direction:column;
  align-items:center; gap:4px;
}

/* Book name — small, spaced, dim gold */
.chapter-book-name {
  font-size:9px; letter-spacing:3.5px;
  text-transform:uppercase;
  color:var(--gold); opacity:0.6; font-weight:400;
}

/* Chapter number — clean serif */
.chapter-number-large {
  font-size:24px; font-weight:600;
  color:var(--ink); line-height:1.15;
  letter-spacing:-0.3px;
}

/* Thin gold rule below chapter number */
.chapter-heading {
  margin-top:6px;
  width:36px; height:1px;
  background:linear-gradient(to right, transparent, var(--gold), transparent);
  opacity:0.45;
}

.chapter-intro {
  font-size:13px; font-style:italic;
  color:var(--ink-dim); line-height:1.7;
}

/* ═══════════════════════════════════════
   Verse rows — printed scripture style
═══════════════════════════════════════ */
.verse-row {
  padding:4px 8px 4px 16px;
  border-left:2px solid transparent;
  border-radius:0 8px 8px 0;
  transition:
    border-color 200ms var(--ease),
    background 200ms var(--ease);
}
.verse-row + .verse-row { margin-top:0; }

.verse-row.current {
  border-left-color:var(--gold);
  background:rgba(201,168,76,0.05);
}

.verse-body {
  font-size:17px; line-height:1.78;
  color:#F0EBE0; font-weight:400;
  font-family:'Noto Serif', Georgia, serif;
}

/* Tiny gold superscript verse numbers — printed scripture style */
.verse-num {
  font-size:10px; font-weight:400;
  color:var(--gold); opacity:0.55;
  vertical-align:super;
  line-height:0;
  margin-right:1px;
  letter-spacing:0.1px;
}

.empty-state {
  padding:48px 0;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:10px; color:var(--ink-dim);
  font-size:14px; text-align:center;
  font-style:italic; line-height:1.6;
}

/* ═══════════════════════════════════════
   Menu overlay — premium card
═══════════════════════════════════════ */
#menu {
  position:absolute; inset:0; display:none;
  background:rgba(0,0,0,0.90);
  backdrop-filter:blur(52px) saturate(0.4);
  -webkit-backdrop-filter:blur(52px) saturate(0.4);
  flex-direction:column;
  justify-content:center;
  padding:0 40px;
}
#menu.active { display:flex; }

.menu-inner {
  border-radius:20px; overflow:hidden;
  border:1px solid rgba(201,168,76,0.18);
  background:rgba(8,7,5,0.90);
  box-shadow:
    0 0 0 1px rgba(0,0,0,0.6),
    0 24px 72px rgba(0,0,0,0.95),
    0 0 60px rgba(201,168,76,0.05),
    inset 0 1px 0 rgba(255,255,255,0.06);
}

.menu-header {
  padding:22px 24px 18px;
  display:flex; flex-direction:column; gap:4px;
}
.menu-header-ref {
  font-family:var(--font); font-size:17px; font-weight:600;
  color:var(--ink); letter-spacing:-0.3px;
}
.menu-header-sub {
  font-size:9px; letter-spacing:3.5px; text-transform:uppercase;
  color:var(--gold); opacity:0.55;
}

.menu-divider {
  height:1px;
  background:linear-gradient(to right,
    transparent,
    rgba(201,168,76,0.25) 15%,
    rgba(201,168,76,0.25) 85%,
    transparent
  );
  margin:0 24px;
}

.menu-btn {
  min-height:54px; width:100%;
  display:flex; align-items:center; gap:16px;
  padding:0 24px;
  border-top:1px solid rgba(255,255,255,0.04);
  font-family:var(--font); font-size:15px;
  font-weight:400; letter-spacing:0.1px;
  color:var(--ink-mid);
  background:transparent;
  transition:
    background 160ms var(--ease),
    color 160ms var(--ease);
  cursor:pointer;
  position:relative;
}
.menu-btn:first-of-type { border-top:none; margin-top:8px; }
.menu-btn:focus {
  outline:none;
  background:rgba(201,168,76,0.07);
  color:var(--ink);
  box-shadow:inset 3px 0 0 rgba(201,168,76,0.65);
}
.menu-btn:focus .menu-icon { color:var(--gold); opacity:1; }

.menu-icon {
  font-size:14px; width:20px;
  text-align:center;
  color:var(--gold); opacity:0.45;
  transition:opacity 160ms var(--ease);
  flex-shrink:0;
}
</style>
</head>
<body>
<div id="app">

  <!-- BOOT -->
  <section class="screen active" id="boot">
    <div class="book-scene">
      <div class="book-wrap">
        <div class="book-left"></div>
        <div class="book-spine"></div>
        <div class="book-right"></div>
        <div class="book-page" style="--n:0"><div class="pg-f"></div><div class="pg-b"></div></div>
        <div class="book-page" style="--n:1"><div class="pg-f"></div><div class="pg-b"></div></div>
        <div class="book-page" style="--n:2"><div class="pg-f"></div><div class="pg-b"></div></div>
        <div class="book-page" style="--n:3"><div class="pg-f"></div><div class="pg-b"></div></div>
        <div class="book-page" style="--n:4"><div class="pg-f"></div><div class="pg-b"></div></div>
      </div>
    </div>
    <div class="boot-wordmark-wrap">
      <div class="boot-wordmark-rule"></div>
      <div class="boot-wordmark">Library</div>
      <div class="boot-wordmark-sub">Scripture Study</div>
    </div>
    <div class="boot-status" id="bootStatus"></div>
  </section>

  <!-- HOME -->
  <section class="screen" id="home">
    <div class="home-label">Scripture Library</div>
    <div class="home-title">Library</div>
    <div class="card-list">
      <div class="card-row focusable" id="homeLibrary" tabindex="0">
        <div class="label">Library</div><div class="chev">›</div>
      </div>
      <div class="card-row focusable" id="homeRecents" tabindex="0">
        <div class="label">Recents</div><div class="chev">›</div>
      </div>
    </div>
  </section>

  <!-- LIBRARY -->
  <section class="screen" id="library">
    <button class="back-btn focusable" onclick="goBack()">
      <span class="back-chev">‹</span><span>Home</span>
    </button>
    <div class="screen-title">Library</div>
    <div class="vol-grid" id="volGrid"></div>
  </section>

  <!-- RECENTS -->
  <section class="screen" id="recents">
    <button class="back-btn focusable" onclick="goBack()">
      <span class="back-chev">‹</span><span>Home</span>
    </button>
    <div class="screen-title">Recents</div>
    <div class="card-list" id="recentsList"></div>
  </section>

  <!-- BOOKS -->
  <section class="screen" id="books">
    <button class="back-btn focusable" onclick="goBack()">
      <span class="back-chev">‹</span><span id="booksBackLabel">Library</span>
    </button>
    <div class="screen-title" id="booksTitle">Books</div>
    <div class="card-list" id="booksList"></div>
  </section>

  <!-- CHAPTERS -->
  <section class="screen" id="chapters">
    <button class="back-btn focusable" onclick="goBack()">
      <span class="back-chev">‹</span><span id="chaptersBackLabel">Books</span>
    </button>
    <div class="screen-title" id="chaptersTitle">Chapters</div>
    <div class="chip-grid" id="chaptersGrid"></div>
  </section>

  <!-- READER -->
  <section class="screen" id="reader">
    <div class="reader-header">
      <div class="ref-tag" id="refTag">—</div>
      <div class="verse-counter" id="verseCounter"></div>
      <div class="bookmark-flag" id="bookmarkFlag">◇</div>
    </div>
    <div class="chapter-scroll" id="chapterScroll"></div>
  </section>

  <!-- MENU -->
  <div id="menu">
    <div class="menu-inner">
      <div class="menu-header">
        <div class="menu-header-ref" id="menuRef">—</div>
        <div class="menu-header-sub">Reading</div>
      </div>
      <div class="menu-divider"></div>
      <button class="menu-btn focusable" data-action="resume"><span class="menu-icon">↩</span>Continue reading</button>
      <button class="menu-btn focusable" data-action="bookmark"><span class="menu-icon">◇</span><span id="bookmarkLabel">Bookmark verse</span></button>
      <button class="menu-btn focusable" data-action="chapters"><span class="menu-icon">≡</span>Chapter list</button>
      <button class="menu-btn focusable" data-action="home"><span class="menu-icon">◁</span>Home</button>
    </div>
  </div>

</div>
<script>
/* ── Data ── */
const SCRIPTURES = { volumes: [] };

async function loadLibrary(){
  const statusEl = document.getElementById('bootStatus');
  try {
    const mRes = await fetch('data/manifest.json');
    if (!mRes.ok) throw new Error('manifest.json not found (' + mRes.status + ')');
    const files = await mRes.json();
    for (const file of files){
      // statusEl hidden via CSS — no visible loading text
      const res = await fetch('data/' + file);
      if (!res.ok){ console.warn('Skipping ' + file); continue; }
      SCRIPTURES.volumes.push(await res.json());
    }
    renderHome(); showScreen('home');
  } catch(err){
    statusEl.textContent = '';
    const el = document.createElement('div'); el.className = 'boot-error';
    el.textContent = 'Could not load the library (' + err.message + '). Serve over http(s) — see README.md.';
    document.getElementById('boot').appendChild(el);
  }
}

function getVolume(id){ return SCRIPTURES.volumes.find(v => v.id === id); }
function getBook(vId,bId){ return getVolume(vId).books.find(b => b.id === bId); }
function getChapter(vId,bId,num){ return getBook(vId,bId).chapters.find(c => c.num === num); }
function verseText(v){ return typeof v === 'string' ? v : v.text; }

/* ── State ── */
let nav = { volumeId:null, bookId:null, chapterNum:null, verseIdx:0 };
let menuOpen = false;
const navHistory = [];

/* ── Persistence ── */
function loadJSON(k,fb){ try{ const r=localStorage.getItem(k); return r?JSON.parse(r):fb; }catch(e){ return fb; } }
function saveJSON(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function recents()  { return loadJSON('gl_recents',[]).filter(entryStillValid); }
function bookmarks(){ return loadJSON('gl_bookmarks',[]).filter(entryStillValid); }
function entryStillValid(e){
  const vol=getVolume(e.volumeId); if(!vol) return false;
  const book=getBook(e.volumeId,e.bookId); if(!book) return false;
  return !!book.chapters.find(c=>c.num===e.chapterNum);
}
function verseKey(v,b,c,i){ return v+'|'+b+'|'+c+'|'+i; }
function touchRecent(){
  const vol=getVolume(nav.volumeId), book=getBook(nav.volumeId,nav.bookId);
  const chapter=getChapter(nav.volumeId,nav.bookId,nav.chapterNum);
  const label=chapter.title?chapter.title:(book.name+' '+nav.chapterNum);
  let list=recents().filter(r=>!(r.volumeId===nav.volumeId&&r.bookId===nav.bookId&&r.chapterNum===nav.chapterNum));
  list.unshift({volumeId:nav.volumeId,bookId:nav.bookId,chapterNum:nav.chapterNum,verseIdx:nav.verseIdx,label,volumeName:vol.name,ts:Date.now()});
  saveJSON('gl_recents',list.slice(0,6));
}
function isBookmarked(){ return bookmarks().some(b=>b.key===verseKey(nav.volumeId,nav.bookId,nav.chapterNum,nav.verseIdx)); }
function toggleBookmark(){
  const key=verseKey(nav.volumeId,nav.bookId,nav.chapterNum,nav.verseIdx);
  let list=bookmarks(); const idx=list.findIndex(b=>b.key===key);
  const book=getBook(nav.volumeId,nav.bookId);
  const chapter=getChapter(nav.volumeId,nav.bookId,nav.chapterNum);
  const label=(chapter.title?chapter.title:(book.name+' '+nav.chapterNum))+' : '+(nav.verseIdx+1);
  if(idx>=0) list.splice(idx,1);
  else list.unshift({key,volumeId:nav.volumeId,bookId:nav.bookId,chapterNum:nav.chapterNum,verseIdx:nav.verseIdx,label,ts:Date.now()});
  saveJSON('gl_bookmarks',list.slice(0,12));
  renderBookmarkFlag();
}

/* ── Navigation history ── */
function showScreen(id, push){
  if(push !== false){
    const cur = document.querySelector('.screen.active');
    if(cur && cur.id !== id) navHistory.push(cur.id);
  }
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  const first = document.getElementById(id).querySelector('.focusable');
  if(first) first.focus();
}
function goBack(){
  const prev = navHistory.pop();
  showScreen(prev || 'home', false);
}

/* ── Row builder ── */
function makeRow(label, sub, onSelect, empty){
  const row = document.createElement('div');
  row.className = 'card-row focusable' + (empty?' empty':'');
  row.tabIndex = 0;
  row.innerHTML = `<div><div class="label">${label}</div>${sub?`<div class="sub">${sub}</div>`:''}</div><div class="chev">›</div>`;
  row.addEventListener('click', onSelect);
  return row;
}

/* ── Home ── */
function renderHome(){
  document.getElementById('homeLibrary').onclick = ()=>{ renderLibrary(); showScreen('library'); };
  document.getElementById('homeRecents').onclick = ()=>{ renderRecents(); showScreen('recents'); };
}

/* ── Vol cover palette ── */
const VOL_COVERS = {
  'ot':     { bg:'#0C0C10', fg:'#C9A84C' },
  'nt':     { bg:'#0C0C10', fg:'#C9A84C' },
  'bom':    { bg:'#152448', fg:'#C9A84C' },
  'dc':     { bg:'#0C0C10', fg:'#C9A84C' },
  'pgp':    { bg:'#0C0C10', fg:'#C9A84C' },
  'bd':     { bg:'#0C0C10', fg:'#C9A84C' },
  'gts':    { bg:'#0C0C10', fg:'#C9A84C' },
  'family': { bg:'#0C0C10', fg:'#C9A84C' },
};

/* ── Library ── */
function renderLibrary(){
  const grid = document.getElementById('volGrid');
  grid.innerHTML = '';
  SCRIPTURES.volumes.forEach(v=>{
    const cover = VOL_COVERS[v.id] || { bg:'#0C0C10', fg:'#C9A84C' };
    const wrap = document.createElement('div');
    wrap.className = 'vol-wrap focusable' + (v.books.length===0?' empty':'');
    wrap.tabIndex = 0;

    const card = document.createElement('div');
    card.className = 'vol-card';
    card.style.setProperty('--cover-bg', cover.bg);
    card.style.setProperty('--cover-fg', cover.fg);

    // Cover photo image — falls back to CSS if 404
    const img = document.createElement('img');
    img.className = 'vol-card-img';
    img.src = 'covers/' + v.id + '.jpg';
    img.alt = v.name;
    img.onerror = function(){ this.style.display = 'none'; };

    // Fallback content (shown when no cover image)
    const fallback = document.createElement('div');
    fallback.className = 'vol-card-fallback';
    fallback.innerHTML = `
      <div class="vol-card-ornament-top"></div>
      <div class="vol-card-name">${v.name}</div>
      <div class="vol-card-ornament-bot"></div>
    `;

    card.appendChild(img);
    card.appendChild(fallback);

    const lbl = document.createElement('div');
    lbl.className = 'vol-label';
    lbl.textContent = v.name;

    wrap.appendChild(card);
    wrap.appendChild(lbl);
    wrap.addEventListener('click', ()=>{
      if(!v.books.length) return;
      nav.volumeId = v.id; renderBooks(); showScreen('books');
    });
    grid.appendChild(wrap);
  });
}

/* ── Recents ── */
function renderRecents(){
  const list = document.getElementById('recentsList');
  list.innerHTML = '';
  const rec = recents();
  const lbl1 = document.createElement('div'); lbl1.className='section-label'; lbl1.textContent='Continue Reading';
  list.appendChild(lbl1);
  if(rec.length){
    rec.forEach(r=>list.appendChild(makeRow(r.label, r.volumeName, ()=>{
      nav={volumeId:r.volumeId,bookId:r.bookId,chapterNum:r.chapterNum,verseIdx:r.verseIdx}; openReader();
    })));
  } else {
    const n = document.createElement('div'); n.className='recents-note';
    n.textContent = 'Chapters you open will appear here.';
    list.appendChild(n);
  }
  const bm = bookmarks();
  if(bm.length){
    const lbl2 = document.createElement('div'); lbl2.className='section-label'; lbl2.textContent='Bookmarks';
    list.appendChild(lbl2);
    bm.forEach(b=>list.appendChild(makeRow('♥ '+b.label, null, ()=>{
      nav={volumeId:b.volumeId,bookId:b.bookId,chapterNum:b.chapterNum,verseIdx:b.verseIdx}; openReader();
    })));
  }
}

/* ── Books ── */
function renderBooks(){
  const vol = getVolume(nav.volumeId);
  document.getElementById('booksTitle').textContent = vol.name;
  document.getElementById('booksBackLabel').textContent = 'Library';
  const list = document.getElementById('booksList');
  list.innerHTML = '';
  vol.books.forEach(b=>list.appendChild(makeRow(b.name, null, ()=>{
    nav.bookId = b.id; renderChapters(); showScreen('chapters');
  })));
}

/* ── Chapters ── */
function renderChapters(){
  const book = getBook(nav.volumeId, nav.bookId);
  document.getElementById('chaptersTitle').textContent = book.name;
  document.getElementById('chaptersBackLabel').textContent = getVolume(nav.volumeId).name;
  const grid = document.getElementById('chaptersGrid');
  grid.innerHTML = '';
  const hasTitles = book.chapters.some(c=>c.title);
  grid.classList.toggle('list-mode', hasTitles);
  book.chapters.forEach(c=>{
    const isEmpty = c.verses.length===0;
    const el = document.createElement('div');
    el.className = (hasTitles?'card-row':'chip') + ' focusable' + (isEmpty?' empty':'');
    el.tabIndex = 0;
    if(hasTitles) el.innerHTML=`<div><div class="label">${c.title}</div></div><div class="chev">›</div>`;
    else el.textContent = c.num;
    el.addEventListener('click',()=>{ if(isEmpty) return; nav.chapterNum=c.num; nav.verseIdx=0; openReader(); });
    grid.appendChild(el);
  });
}

/* ── Reader ── */
function openReader(){ showScreen('reader'); renderChapterContent(); }
function renderChapterContent(){
  const book = getBook(nav.volumeId, nav.bookId);
  const chapter = getChapter(nav.volumeId, nav.bookId, nav.chapterNum);
  document.getElementById('refTag').textContent = chapter.title?chapter.title:(book.name+' · '+nav.chapterNum);
  const scroll = document.getElementById('chapterScroll');
  scroll.innerHTML = '';
  if(!chapter.verses.length){
    const e = document.createElement('div'); e.className='empty-state';
    e.textContent = 'No text loaded for this chapter yet.';
    scroll.appendChild(e);
    document.getElementById('verseCounter').textContent = '';
    document.getElementById('bookmarkFlag').classList.remove('on');
    return;
  }
  const hdr = document.createElement('div');
  hdr.className = 'chapter-header';
  if(chapter.title){
    hdr.innerHTML = `<div class="chapter-intro">${chapter.title}</div>`;
  } else {
    hdr.innerHTML = `
      <div class="chapter-book-name">${book.name}</div>
      <div class="chapter-number-large">${nav.chapterNum}</div>
      <div class="chapter-heading"></div>
    `;
  }
  scroll.appendChild(hdr);

  chapter.verses.forEach((v,i)=>{
    const row = document.createElement('div');
    row.className = 'verse-row'; row.dataset.idx = i;
    row.innerHTML = `<div class="verse-body"><span class="verse-num">${i+1}</span> ${verseText(v)}</div>`;
    scroll.appendChild(row);
  });
  requestAnimationFrame(()=>updateVerseUI(false));
}
function updateVerseUI(smooth){
  const scroll = document.getElementById('chapterScroll');
  const chapter = getChapter(nav.volumeId, nav.bookId, nav.chapterNum);
  scroll.querySelectorAll('.verse-row').forEach(el=>{
    el.classList.toggle('current', parseInt(el.dataset.idx)===nav.verseIdx);
  });
  const cur = scroll.querySelector('.verse-row.current');
  if(cur) cur.scrollIntoView({block:'center',behavior:smooth?'smooth':'instant'});
  document.getElementById('verseCounter').textContent = (nav.verseIdx+1)+' / '+chapter.verses.length;
  renderBookmarkFlag(); touchRecent();
}
function renderBookmarkFlag(){
  const on = isBookmarked();
  const flag = document.getElementById('bookmarkFlag');
  flag.classList.toggle('on', on);
  flag.textContent = on ? '◆' : '◇';
  document.getElementById('bookmarkLabel').textContent = on?'Remove bookmark':'Bookmark verse';
}
function stepVerse(d){
  const ch = getChapter(nav.volumeId, nav.bookId, nav.chapterNum);
  if(!ch.verses.length) return;
  nav.verseIdx = Math.max(0, Math.min(ch.verses.length-1, nav.verseIdx+d));
  updateVerseUI(true);
}
function stepChapter(d){
  const book = getBook(nav.volumeId, nav.bookId);
  const idx = book.chapters.findIndex(c=>c.num===nav.chapterNum);
  const next = (idx+d+book.chapters.length)%book.chapters.length;
  nav.chapterNum = book.chapters[next].num; nav.verseIdx = 0;
  renderChapterContent();
}

/* ── Menu ── */
function visibleMenuBtns(){ return Array.from(document.querySelectorAll('#menu .focusable')).filter(el=>el.style.display!=='none'); }
function openMenu(){
  menuOpen = true;
  const ch = getChapter(nav.volumeId, nav.bookId, nav.chapterNum);
  const book = getBook(nav.volumeId, nav.bookId);
  const bBtn = document.querySelector('.menu-btn[data-action="bookmark"]');
  bBtn.style.display = ch.verses.length===0?'none':'flex';
  const ref = ch.title ? ch.title : book.name + ' ' + nav.chapterNum;
  document.getElementById('menuRef').textContent = ref;
  document.getElementById('menu').classList.add('active');
  const first = visibleMenuBtns()[0]; if(first) first.focus();
}
function closeMenu(){ menuOpen=false; document.getElementById('menu').classList.remove('active'); }
document.querySelectorAll('#menu .menu-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const a = btn.dataset.action;
    if(a==='resume') closeMenu();
    else if(a==='bookmark'){ toggleBookmark(); closeMenu(); }
    else if(a==='chapters'){ closeMenu(); renderChapters(); showScreen('chapters', false); }
    else if(a==='home'){ closeMenu(); navHistory.length=0; showScreen('home', false); }
  });
});

/* ── Focus helpers ── */
function visibleFocusables(scope){
  return Array.from(scope.querySelectorAll('.focusable')).filter(el=>{
    let n=el;
    while(n && n!==scope){
      if(getComputedStyle(n).display==='none') return false;
      n=n.parentElement;
    }
    return true;
  });
}

/* Group items into rows by their Y position (for 2D grid nav) */
function getGridRows(items){
  const rows = [];
  for(const item of items){
    const top = Math.round(item.getBoundingClientRect().top);
    const lastRow = rows[rows.length-1];
    if(lastRow && Math.abs(lastRow[0].getBoundingClientRect().top - top) < 10){
      lastRow.push(item);
    } else {
      rows.push([item]);
    }
  }
  return rows;
}

/* ── 2D grid move ── */
function moveInGrid(gridItems, allItems, dir){
  const cur = document.activeElement;
  const rows = getGridRows(gridItems);
  let rowIdx=-1, colIdx=-1;
  for(let r=0;r<rows.length;r++){
    const c=rows[r].indexOf(cur);
    if(c!==-1){ rowIdx=r; colIdx=c; break; }
  }
  if(rowIdx===-1){ gridItems[0].focus(); return; }

  let target = null;
  if(dir==='left'){
    if(colIdx>0) target = rows[rowIdx][colIdx-1];
    else {
      /* left edge: go to the nearest non-grid item above (back button etc.) */
      const gridStart = allItems.indexOf(gridItems[0]);
      if(gridStart>0) target = allItems[gridStart-1];
    }
  } else if(dir==='right'){
    if(colIdx < rows[rowIdx].length-1) target = rows[rowIdx][colIdx+1];
    else if(rowIdx < rows.length-1)    target = rows[rowIdx+1][0];
  } else if(dir==='up'){
    if(rowIdx>0){
      const pr = rows[rowIdx-1];
      target = pr[Math.min(colIdx, pr.length-1)];
    } else {
      const gridStart = allItems.indexOf(gridItems[0]);
      if(gridStart>0) target = allItems[gridStart-1];
    }
  } else if(dir==='down'){
    if(rowIdx < rows.length-1){
      const nr = rows[rowIdx+1];
      target = nr[Math.min(colIdx, nr.length-1)];
    }
  }

  if(target){ target.focus(); target.scrollIntoView({block:'nearest',behavior:'smooth'}); }
}

/* ── Main move focus ── */
function moveFocus(dir){
  const scope = menuOpen ? document.getElementById('menu') : document.querySelector('.screen.active');
  const items = visibleFocusables(scope);
  if(!items.length) return;

  const cur = document.activeElement;

  /* Check if in a 2D grid context */
  const volGrid  = cur.closest('.vol-grid');
  const chipGrid = cur.closest('.chip-grid:not(.list-mode)');
  const gridHost = volGrid || chipGrid;

  if(gridHost){
    const gridItems = items.filter(el=>gridHost.contains(el));
    moveInGrid(gridItems, items, dir);
    return;
  }

  /* 1D list navigation */
  const idx = items.indexOf(cur);
  if(idx===-1){ items[0].focus(); return; }
  const next = (dir==='up'||dir==='left')
    ? (idx>0 ? idx-1 : items.length-1)
    : (idx<items.length-1 ? idx+1 : 0);
  items[next].focus();
  items[next].scrollIntoView({block:'nearest',behavior:'smooth'});
}

/* ── Keyboard ── */
const DPAD = {UP:'ArrowUp',DOWN:'ArrowDown',LEFT:'ArrowLeft',RIGHT:'ArrowRight',SELECT:'Enter'};
document.addEventListener('keydown', e=>{
  const onReader = document.getElementById('reader').classList.contains('active');
  if(onReader && !menuOpen){
    switch(e.key){
      case DPAD.UP:    stepVerse(-1);   break;
      case DPAD.DOWN:  stepVerse(1);    break;
      case DPAD.LEFT:  stepChapter(-1); break;
      case DPAD.RIGHT: stepChapter(1);  break;
      case DPAD.SELECT: openMenu();     break;
      default: return;
    }
    e.preventDefault(); return;
  }
  switch(e.key){
    case DPAD.UP:    moveFocus('up');    break;
    case DPAD.DOWN:  moveFocus('down');  break;
    case DPAD.LEFT:  moveFocus('left');  break;
    case DPAD.RIGHT: moveFocus('right'); break;
    case DPAD.SELECT:
      if(document.activeElement.classList.contains('focusable')) document.activeElement.click();
      break;
    default: return;
  }
  e.preventDefault();
});

/* ── Init ── */
loadLibrary();
</script>
