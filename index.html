<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="description" content="A scripture study companion for Meta Ray-Ban Display glasses">
<meta name="mrbd-web-app-capable" content="yes">
<meta property="og:image" content="https://ethanmcconkie.github.io/gospel-glasses/icon.png">
<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">
<meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
<link rel="icon" href="icon-96.png" sizes="96x96">
<link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<title>Bookshelf</title>
<style>
/* ═══════════════════════════════════════════════════════════════
   BOOKSHELF v2 — "floating library" design language
   Meta Ray-Ban Display · 600×600 additive glass
   Bubbles of soft light instead of hairlines and small caps.
   ═══════════════════════════════════════════════════════════════ */

:root {
  --bg:        #000;
  --ink:       #F0EBE0;
  --ink-mid:   rgba(240,235,224,0.64);
  --ink-dim:   rgba(240,235,224,0.40);
  --gold:      #C9A84C;
  --gold-soft: rgba(201,168,76,0.30);
  --gold-glow: rgba(201,168,76,0.16);
  --gold-foil: #D9B678;

  --bubble:      rgba(255,255,255,0.065);   /* resting surface */
  --bubble-hi:   rgba(255,255,255,0.13);    /* focused surface */
  --ring:        rgba(240,235,224,0.35);    /* focus ring light */
  --ring-glow:   rgba(240,235,224,0.14);

  --r-pill: 999px;
  --r-card: 18px;
  --r-chip: 13px;
  --r-cover: 10px;

  --font: 'Noto Serif', Georgia, serif;
  --font-scripture: 'Palatino Linotype', 'Palatino', 'URW Palladio L', 'Book Antiqua', Georgia, 'Noto Serif', serif;
  --ease: cubic-bezier(0.4,0,0.2,1);
  --ease-out: cubic-bezier(0,0,0.2,1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 600px; height: 600px;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
::-webkit-scrollbar { display: none; }
* { scrollbar-width: none; }
#app { position: relative; width: 600px; height: 600px; overflow: hidden; }
:focus { outline: none; }

.screen {
  position: absolute; inset: 0;
  display: none; flex-direction: column;
  padding: 30px 36px 24px;
  opacity: 0;
}
.screen.active { display: flex; animation: screenIn 240ms var(--ease-out) forwards; }
@keyframes screenIn {
  from { opacity: 0; transform: translateY(10px) scale(0.99); }
  to   { opacity: 1; transform: none; }
}

/* ───────────── BOOT (kept: the book, softened wordmark) ───────────── */
#boot { justify-content: center; align-items: center; padding: 0; }
.book-scene {
  position: relative; width: 340px; height: 240px;
  display: flex; align-items: center; justify-content: center;
  perspective: 900px;
}
.book-scene::before {
  content: '';
  position: absolute; inset: -40px;
  background: radial-gradient(ellipse 60% 50% at 50% 55%,
              rgba(240,235,224,0.10), rgba(240,235,224,0.03) 55%, transparent 75%);
  animation: sceneBreathe 4.5s ease-in-out infinite;
}
@keyframes sceneBreathe {
  0%,100% { opacity: .7; transform: scale(1); }
  50%     { opacity: 1;  transform: scale(1.06); }
}
.book-wrap {
  position: relative; width: 240px; height: 158px;
  transform: rotateX(32deg) rotateY(-6deg);
  transform-style: preserve-3d;
}
.book-left, .book-right {
  position: absolute; top: 0; bottom: 0; width: 50%;
  background: linear-gradient(180deg, rgba(240,235,224,0.10), rgba(240,235,224,0.055));
  border: 1px solid rgba(240,235,224,0.10);
}
.book-left  { left: 0;  border-radius: 8px 0 0 8px; border-right: none; }
.book-right { right: 0; border-radius: 0 8px 8px 0; border-left: none; }
.book-spine {
  position: absolute; left: 50%; top: -2px; bottom: -2px;
  width: 2px; transform: translateX(-50%);
  background: linear-gradient(180deg, transparent, rgba(240,235,224,0.35) 20%, rgba(240,235,224,0.35) 80%, transparent);
}
.book-page {
  position: absolute; left: 50%; top: 2px;
  width: calc(50% - 3px); height: calc(100% - 4px);
  transform-origin: left center;
  transform-style: preserve-3d;
  animation: pgFlip 3.6s var(--ease) infinite;
  animation-delay: calc(var(--n) * 0.55s);
}
.pg-f, .pg-b { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 0 8px 8px 0; }
.pg-f { background: linear-gradient(105deg, rgba(240,235,224,0.16), rgba(240,235,224,0.08));
        border: 1px solid rgba(240,235,224,0.12); }
.pg-b { background: linear-gradient(255deg, rgba(240,235,224,0.10), rgba(240,235,224,0.05));
        border: 1px solid rgba(240,235,224,0.08); transform: rotateY(180deg); }
@keyframes pgFlip {
  0%       { transform: rotateY(0deg); }
  12%      { transform: rotateY(-38deg); }
  38%      { transform: rotateY(-92deg); filter: brightness(1.5); }
  62%      { transform: rotateY(-148deg); filter: brightness(1); }
  74%,100% { transform: rotateY(-178deg); }
}
.boot-wordmark-wrap { margin-top: 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.boot-wordmark { font-size: 28px; letter-spacing: 0.02em; animation: bootWmFade 900ms var(--ease-out) 600ms both; }
@keyframes bootWmFade {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: none; }
}
.boot-status { margin-top: 16px; font-size: 11px; color: var(--ink-dim); }
.boot-error {
  margin-top: 14px; max-width: 430px;
  font-size: 12px; line-height: 1.6; text-align: center;
  color: var(--ink-mid);
  background: var(--bubble);
  border-radius: var(--r-chip);
  padding: 14px 18px;
}

/* ───────────── HOME · pill bar ───────────── */
.pill-bar {
  align-self: center;
  display: flex; gap: 6px;
  padding: 7px 10px;
  background: rgba(255,255,255,0.075);
  border-radius: var(--r-pill);
  margin-bottom: 12px;
  box-shadow: 0 0 24px rgba(240,235,224,0.05);
}
.pill {
  width: 58px; height: 44px;
  display: flex; align-items: center; justify-content: center;
  border: none; cursor: pointer;
  background: transparent;
  border-radius: var(--r-pill);
  color: var(--ink-dim);
  transition: background 200ms var(--ease), color 200ms var(--ease), box-shadow 200ms var(--ease);
}
.pill svg { width: 21px; height: 21px; }
.pill.active { background: rgba(255,255,255,0.14); color: var(--ink); }
.pill:focus {
  background: var(--bubble-hi);
  color: var(--ink);
  box-shadow: 0 0 0 1.5px var(--ring), 0 0 18px var(--ring-glow);
}
.pill.active:focus { color: var(--ink); box-shadow: 0 0 0 1.5px var(--ring), 0 0 18px var(--ring-glow); }

/* ───────────── HOME · hero continue card ───────────── */
.hero-card {
  display: flex; align-items: center; gap: 20px;
  padding: 20px;
  background: var(--bubble);
  border-radius: var(--r-card);
  cursor: pointer;
  transition: background 220ms var(--ease), box-shadow 220ms var(--ease), transform 220ms var(--ease);
}
.hero-card:focus {
  background: var(--bubble-hi);
  box-shadow: 0 0 0 1.5px var(--ring), 0 0 26px var(--ring-glow);
  transform: translateY(-2px);
}
.hero-cover {
  width: 92px; height: 132px;
  flex-shrink: 0;
  border-radius: var(--r-cover);
  overflow: hidden;
  position: relative;
}
.hero-info { flex: 1; min-width: 0; }
.hero-kicker { font-size: 11px; color: var(--ink-dim); margin-bottom: 6px; }
.hero-title { font-size: 25px; margin-bottom: 4px; }
.hero-sub { font-size: 12px; color: var(--ink-mid); margin-bottom: 15px; }
.hero-prog { display: flex; align-items: center; gap: 12px; }
.hero-prog .bar { flex: 1; }
.hero-pct { font-size: 11px; color: var(--ink-mid); font-variant-numeric: tabular-nums; }

.bar { height: 4px; border-radius: 2px; background: rgba(240,235,224,0.12); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 2px; background: var(--gold);
         box-shadow: 0 0 8px rgba(201,168,76,0.55); }

.votd {
  display: block; width: 100%; text-align: left;
  background: var(--bubble); border: none;
  border-radius: var(--r-card);
  padding: 15px 18px;
  font-family: inherit; color: inherit;
  transition: background 220ms var(--ease), box-shadow 220ms var(--ease), transform 220ms var(--ease);
}
.votd:focus {
  outline: none;
  background: var(--bubble-hi);
  box-shadow: 0 0 0 1.5px var(--ring), 0 0 26px var(--ring-glow);
  transform: translateY(-2px);
}
.votd-txt {
  font-family: var(--font-scripture);
  font-size: 14px; line-height: 1.55;
  color: var(--ink-mid);
}
.votd-ref {
  font-family: var(--font-scripture);
  font-size: 11px; letter-spacing: 0.06em;
  color: #D9B678; margin-top: 9px; text-align: right;
}

.music-card {
  display: flex; align-items: center; gap: 16px;
  width: 100%; text-align: left;
  padding: 14px 16px;
  background: var(--bubble); border: none;
  border-radius: var(--r-card);
  font-family: inherit; color: inherit;
  transition: background 220ms var(--ease), box-shadow 220ms var(--ease), transform 220ms var(--ease);
}
.music-card:focus {
  outline: none;
  background: var(--bubble-hi);
  box-shadow: 0 0 0 1.5px var(--ring), 0 0 26px var(--ring-glow);
  transform: translateY(-2px);
}
.music-cover {
  width: 60px; height: 86px; flex-shrink: 0;
  border-radius: var(--r-cover);
  overflow: hidden; position: relative;
  background: #000;
}
.music-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.music-kicker { font-size: 11px; color: var(--ink-dim); margin-bottom: 4px; }
.music-title  { font-size: 16px; line-height: 1.2; }

/* Home grew past one screen, so it scrolls. Padding + negative side margin
   keeps focus glow from being clipped without shifting anything. */
.home-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 20px 26px 40px;
  margin: 0 -26px;
}
.home-section-label {
  font-size: 12px; color: var(--ink-dim);
  margin: 20px 4px 10px;
}
.home-recents-label {
  font-size: 12px; color: var(--ink-dim); margin: 24px 4px 10px;
  background: none; border: none; padding: 0; font-family: inherit;
  cursor: default; -webkit-tap-highlight-color: transparent;
}
.home-recents-label:focus {
  outline: none; color: var(--ink-mid);
}
.recent-chips { display: flex; flex-wrap: wrap; gap: 10px; }
.rchip {
  display: flex; align-items: center; gap: 9px;
  padding: 11px 16px;
  border: none; cursor: pointer;
  background: var(--bubble);
  border-radius: var(--r-pill);
  font-family: var(--font);
  font-size: 13.5px;
  color: var(--ink-mid);
  transition: background 200ms var(--ease), color 200ms var(--ease), box-shadow 200ms var(--ease);
}
.rchip-icon { width: 13px; height: 13px; flex-shrink: 0; color: var(--gold-foil); }
.rchip:focus {
  background: var(--bubble-hi);
  color: var(--ink);
  box-shadow: 0 0 0 1.5px var(--ring), 0 0 18px var(--ring-glow);
}

/* ───────────── SHARED · titles, back, rows ───────────── */
.home-label { display: none; }
.home-title, .screen-title { font-size: 26px; margin-bottom: 20px; }
.screen-title-center {
  align-self: center;
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink);
  margin-bottom: 14px;
}

.back-btn {
  align-self: flex-start;
  display: flex; align-items: center; gap: 6px;
  background: var(--bubble);
  border: none; cursor: pointer;
  border-radius: var(--r-pill);
  font-family: var(--font);
  font-size: 12.5px;
  color: var(--ink-mid);
  padding: 8px 15px 8px 11px;
  margin-bottom: 16px;
  transition: background 200ms var(--ease), color 200ms var(--ease), box-shadow 200ms var(--ease);
}
.back-chev { font-size: 16px; line-height: 1; transform: translateY(-1px); }
.back-btn:focus {
  background: var(--bubble-hi);
  color: var(--ink);
  box-shadow: 0 0 0 1.5px var(--ring), 0 0 16px var(--ring-glow);
}

.recents-scroll {
  flex: 1; overflow-y: auto;
  display: flex; flex-direction: column;
  padding: 20px 22px 34px;
  margin: 0 -20px;
}
.recents-scroll .recent-chips { margin-bottom: 4px; }
.card-list {
  flex: 1; overflow-y: auto;
  display: flex; flex-direction: column; gap: 8px;
  padding: 20px 22px 34px;
  margin: 0 -20px;
}
.card-row {
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: space-between;
  min-height: 56px;
  padding: 0 18px;
  background: var(--bubble);
  border-radius: var(--r-chip);
  cursor: pointer;
  transition: background 200ms var(--ease), box-shadow 200ms var(--ease);
}
.card-row .label { font-size: 16px; color: var(--ink-mid); transition: color 200ms var(--ease); }
.card-row .sub { font-size: 11px; color: var(--ink-dim); margin-top: 3px; }
.card-row .chev { font-size: 17px; color: var(--ink-dim); transition: color 200ms var(--ease), transform 200ms var(--ease); }
.card-row:focus {
  background: var(--bubble-hi);
  box-shadow: 0 0 0 1.5px var(--ring), 0 0 18px var(--ring-glow);
}
.card-row:focus .label { color: var(--ink); }
.card-row:focus .chev  { color: var(--ink); transform: translateX(2px); }
.card-row.empty { opacity: 0.4; }

.section-label { font-size: 12px; color: var(--ink-dim); margin: 18px 4px 4px; }
.section-label:first-child { margin-top: 0; }
.recents-note { font-size: 12.5px; color: var(--ink-dim); padding: 10px 14px; line-height: 1.6; }

/* ───────────── LIBRARY GRID (softened covers) ───────────── */
.vol-grid {
  flex: 1;
  overflow-y: auto;
  display: grid;
  grid-template-columns: repeat(4, 92px);
  justify-content: center;
  gap: 18px 14px;
  padding: 20px 28px 40px;
  margin: 0 -24px;
  align-content: start;
}
.vol-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; }
.vol-wrap.empty { opacity: 0.45; }
.vol-card {
  position: relative;
  width: 100%;
  aspect-ratio: 2/3;
  border-radius: var(--r-cover);
  overflow: hidden;
  background: var(--cover-bg, var(--bubble));
  transition: transform 220ms var(--ease), box-shadow 220ms var(--ease);
}
.vol-card-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
/* ── Shared cover art · sizes off --cw, set per context ── */
.cover-art {
  position: absolute; inset: 0;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: calc(var(--cw) * 0.25) calc(var(--cw) * 0.06) 0;
}
.cover-art-title {
  flex: 0 0 auto;
  width: 84%;
  font-family: var(--font-scripture);
  font-size: calc(var(--cw) * 0.082);
  line-height: 1.2;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  text-align: center;
  color: var(--gold-foil);
  border-top: 1px solid var(--gold-foil);
  border-bottom: 1px solid var(--gold-foil);
  padding: calc(var(--cw) * 0.032) 0;
}
.vol-card-ornament-top, .vol-card-ornament-bot { display: none; }
.vol-wrap:focus .vol-card {
  transform: translateY(-4px) scale(1.05);
  box-shadow: 0 0 0 1.5px var(--ring), 0 0 24px var(--ring-glow), 0 0 44px rgba(240,235,224,0.06);
}
.vol-label { font-size: 8.5px; color: var(--ink-dim); text-align: center; line-height: 1.4; transition: color 220ms var(--ease); }
.vol-wrap:focus .vol-label { color: var(--ink-mid); }

/* ───────────── CHAPTER CHIPS ───────────── */
.hymn-search {
  display: none;
  align-items: center; gap: 9px;
  width: 100%;
  background: var(--bubble); border: none; border-radius: 999px;
  padding: 11px 16px;
  color: var(--ink-dim); font-family: inherit; font-size: 13px;
  margin: 4px 0 0;
  transition: background 200ms var(--ease), box-shadow 200ms var(--ease), color 200ms var(--ease);
}
.hymn-search.shown { display: flex; }
.hymn-search:focus, .hymn-search.open {
  outline: none;
  background: var(--bubble-hi);
  box-shadow: 0 0 0 1.5px var(--ring);
  color: var(--ink);
}
.hymn-search .digits { font-variant-numeric: tabular-nums; letter-spacing: 0.04em; }

.hymn-keypad { display: none; margin-top: 12px; }
.hymn-keypad.open { display: block; }
.hymn-preview {
  font-family: var(--font-scripture);
  font-size: 12px; color: #D9B678;
  padding: 0 2px 12px; min-height: 1.4em;
}
.keypad-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
}
.key {
  height: 50px; border: none; border-radius: 12px;
  background: var(--bubble); color: var(--ink);
  font-size: 19px; font-family: inherit;
  transition: background 200ms var(--ease), box-shadow 200ms var(--ease);
}
.key.alt { font-size: 13px; color: var(--ink-dim); }
.key.go { color: #D9B678; }
.key:focus {
  outline: none;
  background: var(--bubble-hi);
  box-shadow: 0 0 0 1.5px var(--ring);
}

.chip-grid {
  flex: 1; overflow-y: auto;
  display: flex; flex-wrap: wrap; gap: 11px;
  align-content: flex-start;
  padding: 20px 24px 40px;
  margin: 0 -22px;
}
.chip-grid.list-mode { flex-direction: column; flex-wrap: nowrap; gap: 8px; }
.chip-grid.list-mode .card-row { width: 100%; }
.chip {
  width: 60px; height: 60px;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px;
  color: var(--ink-mid);
  background: var(--bubble);
  border-radius: var(--r-chip);
  cursor: pointer;
  transition: color 200ms var(--ease), background 200ms var(--ease), box-shadow 200ms var(--ease);
}
.chip:focus {
  color: var(--ink);
  background: var(--bubble-hi);
  box-shadow: 0 0 0 1.5px var(--ring), 0 0 16px var(--ring-glow);
}
.chip.empty { opacity: 0.35; }

/* ───────────────────────── READER ─────────────────────────
   The heart of the app: a printed page made of light.     */
#reader { padding: 26px 0 0; }

.reader-header {
  display: flex; align-items: baseline;
  gap: 14px;
  padding: 0 38px 13px;
  position: relative;
}
/* hairline with a 48px gold accent at its head */
.reader-header::after {
  content: '';
  position: absolute; left: 38px; right: 38px; bottom: 0;
  height: 1px;
  background: linear-gradient(90deg, rgba(240,235,224,0.38) 0 48px, var(--divider) 48px);
}
.ref-tag {
  font-size: 11px; font-weight: 600;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--ink-mid);
}
.verse-counter {
  font-size: 11px;
  letter-spacing: 0.08em;
  color: var(--ink-dim);
  margin-left: auto;
  font-variant-numeric: tabular-nums;
}
.bookmark-flag {
  font-size: 15px;
  color: var(--ink-dim);
  transition: color 200ms var(--ease), text-shadow 200ms var(--ease);
}
.bookmark-flag.on {
  color: var(--gold);
  text-shadow: 0 0 10px rgba(201,168,76,0.5);
}

.chapter-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 22px 46px 90px;
  scroll-behavior: smooth;
}

.chapter-header { margin: 6px 0 26px; }
.chapter-book-name {
  font-family: var(--font-scripture);
  font-size: 13px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  text-align: center;
  color: var(--ink-dim);
  margin-bottom: 10px;
}
.chapter-number-large {
  font-family: var(--font-scripture);
  font-size: 23px;
  text-align: center;
  color: var(--ink);
  margin-bottom: 16px;
}
.chapter-heading { display: none; }
.chapter-summary {
  font-family: var(--font-scripture);
  font-size: 15.5px;
  font-style: italic;
  line-height: 1.6;
  color: var(--ink-mid);
  margin: 0 6px 4px;
}
.chapter-intro {
  font-family: var(--font-scripture);
  font-size: 21px;
  text-align: center;
  line-height: 1.5;
  color: var(--ink);
}

.verse-row {
  padding: 5px 14px 5px 16px;
  margin: 0 -16px;
  border-left: 2px solid transparent;
  border-radius: 0 3px 3px 0;
  transition: background 220ms var(--ease), border-color 220ms var(--ease);
}
.verse-row.current {
  border-left-color: var(--gold);
  background: linear-gradient(90deg, rgba(201,168,76,0.07), rgba(201,168,76,0.015) 70%, transparent);
}
.verse-body {
  font-family: var(--font-scripture);
  font-size: 18.5px;
  line-height: 1.62;
  color: var(--ink-mid);
  transition: color 220ms var(--ease);
  text-indent: 1.1em;
}
.verse-row.current .verse-body { color: var(--ink); }
.verse-num {
  font-size: 18.5px;
  color: inherit;
  margin-right: 1px;
  font-variant-numeric: tabular-nums;
}

/* Hymn stanzas: poetry layout — no paragraph indent, looser leading */
#chapterScroll[data-volume="hymns"] .verse-body {
  text-indent: 0;
  line-height: 1.85;
}
#chapterScroll[data-volume="hymns"] .verse-num {
  display: inline-block;
  min-width: 1.4em;
  font-size: 10px;
  vertical-align: super;
  color: var(--gold);
  opacity: 0.7;
}

.empty-state {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 10px;
  padding: 80px 60px;
  text-align: center;
  color: var(--ink-dim);
  font-size: 13.5px;
  line-height: 1.7;
}

/* ───────────── MENU (bubble sheet) ───────────── */
#menu {
  position: absolute; inset: 0;
  display: none;
  align-items: center; justify-content: center;
  background: rgba(0,0,0,0.90);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}
#menu.active { display: flex; animation: menuIn 200ms var(--ease-out) forwards; }
@keyframes menuIn { from { opacity: 0; } to { opacity: 1; } }
.menu-inner {
  width: 380px;
  background: rgba(28,27,24,0.85);
  border-radius: 22px;
  padding: 22px 14px 14px;
  animation: menuCard 220ms var(--ease-out) forwards;
}
@keyframes menuCard {
  from { opacity: 0; transform: translateY(12px) scale(0.97); }
  to   { opacity: 1; transform: none; }
}
.menu-header { padding: 2px 12px 14px; }
.menu-header-sub { font-size: 11px; color: var(--ink-dim); margin-bottom: 4px; }
.menu-header-ref { font-size: 21px; margin-bottom: 8px; }
.menu-verse-preview {
  font-size: 13px;
  font-style: italic;
  line-height: 1.55;
  color: var(--ink-mid);
}
.menu-divider { height: 1px; margin: 0 8px 12px; background: rgba(240,235,224,0.08); border-radius: 1px; }
.menu-btn {
  width: 100%;
  display: flex; align-items: center; gap: 14px;
  min-height: 52px;
  padding: 0 16px;
  margin-bottom: 6px;
  background: transparent;
  border: none; cursor: pointer;
  border-radius: 14px;
  font-family: var(--font);
  font-size: 15px;
  color: var(--ink-mid);
  text-align: left;
  transition: background 200ms var(--ease), color 200ms var(--ease), box-shadow 200ms var(--ease);
}
.menu-icon {
  width: 36px; height: 36px;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,0.06);
  border-radius: 50%;
  color: var(--ink-dim);
  transition: color 200ms var(--ease), background 200ms var(--ease);
}
.menu-icon svg { width: 17px; height: 17px; }
.menu-btn:focus {
  background: var(--bubble-hi);
  color: var(--ink);
  box-shadow: 0 0 0 1.5px var(--ring), 0 0 16px var(--ring-glow);
}
.menu-btn:focus .menu-icon { color: var(--ink); background: rgba(255,255,255,0.10); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
  .book-page { animation: none; transform: rotateY(-178deg); }
}
</style>
<body>
<div id="app">

  <!-- BOOT -->
  <section class="screen active" id="boot">
    <div class="book-scene">
      <div class="book-wrap">
        <div class="book-left"></div>

  <!-- LIBRARY -->

    <nav class="pill-bar">
      <button class="pill focusable" data-nav="home" tabindex="0" aria-label="Home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20a1 1 0 0 0 1 1H10v-6h4v6h3.5a1 1 0 0 0 1-1V9.5"/></svg>
      </button>
      <button class="pill active focusable" data-nav="library" tabindex="0" aria-label="Library">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h4v16H4z"/><path d="M10 4h4v16h-4z"/><path d="m16.5 4.6 3.4.9-3.9 15-3.4-.9z"/></svg>
      </button>
      <button class="pill focusable" data-nav="bookmarks" tabindex="0" aria-label="Bookmarks">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4.5L5 21V4a1 1 0 0 1 1-1z"/></svg>
      </button>
      <button class="pill focusable" data-nav="recents" tabindex="0" aria-label="Recents">

  <!-- RECENTS -->

  <!-- BOOKS -->

    <button class="hymn-search focusable" id="hymnSearchBtn" tabindex="0">

        <span class="menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15.5H6.5A2.5 2.5 0 0 0 4 21z"/><path d="M4 18.5A2.5 2.5 0 0 1 6.5 16H20"/></svg></span>

        <span>Chapter list</span>

        <span>Home</span>

<script>
/* ── Data ── */
const SCRIPTURES = { volumes: [] };

async function loadLibrary(){
  const statusEl = document.getElementById('bootStatus');
  try {
    const mRes = await fetch('data/manifest.json');
    if (!mRes.ok) throw new Error('manifest.json not found (' + mRes.status + ')');
    const files = await mRes.json();
    for (const file of files){
      // statusEl hidden via CSS — no visible loading text
      const res = await fetch('data/' + file);
      if (!res.ok){ console.warn('Skipping ' + file); continue; }
      SCRIPTURES.volumes.push(await res.json());
    }
    renderHome(); showScreen('home');
  } catch(err){
    statusEl.textContent = '';
    const el = document.createElement('div'); el.className = 'boot-error';
    el.textContent = 'Could not load the library (' + err.message + '). Serve over http(s) — see README.md.';
    document.getElementById('boot').appendChild(el);
  }
}

function getVolume(id){ return SCRIPTURES.volumes.find(v => v.id === id); }
function getBook(vId,bId){ return getVolume(vId).books.find(b => b.id === bId); }
function getChapter(vId,bId,num){ return getBook(vId,bId).chapters.find(c => c.num === num); }
function verseText(v){ return typeof v === 'string' ? v : v.text; }

/* ── State ── */
let nav = { volumeId:null, bookId:null, chapterNum:null, verseIdx:0 };
let menuOpen = false;
const navHistory = [];

/* ── Persistence ── */
function loadJSON(k,fb){ try{ const r=localStorage.getItem(k); return r?JSON.parse(r):fb; }catch(e){ return fb; } }
function saveJSON(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function recents()  { return loadJSON('gl_recents',[]).filter(e=>entryStillValid(e) && e.volumeId!=='hymns'); }
function bookmarks(){ return loadJSON('gl_bookmarks',[]).filter(entryStillValid); }
function entryStillValid(e){
  const vol=getVolume(e.volumeId); if(!vol) return false;
  const book=getBook(e.volumeId,e.bookId); if(!book) return false;
  return !!book.chapters.find(c=>c.num===e.chapterNum);
}
function verseKey(v,b,c,i){ return v+'|'+b+'|'+c+'|'+i; }
function touchRecent(){
  if(nav.volumeId === 'hymns') return;
  const vol=getVolume(nav.volumeId), book=getBook(nav.volumeId,nav.bookId);
  const chapter=getChapter(nav.volumeId,nav.bookId,nav.chapterNum);
  const label=chapter.title?chapter.title:(book.name+' '+nav.chapterNum);
  let list=recents().filter(r=>!(r.volumeId===nav.volumeId&&r.bookId===nav.bookId&&r.chapterNum===nav.chapterNum));
  list.unshift({volumeId:nav.volumeId,bookId:nav.bookId,chapterNum:nav.chapterNum,verseIdx:nav.verseIdx,label,volumeName:vol.name,ts:Date.now()});
  saveJSON('gl_recents',list.slice(0,6));
}
function isBookmarked(){ return bookmarks().some(b=>b.key===verseKey(nav.volumeId,nav.bookId,nav.chapterNum,nav.verseIdx)); }
function toggleBookmark(){
  const key=verseKey(nav.volumeId,nav.bookId,nav.chapterNum,nav.verseIdx);
  let list=bookmarks(); const idx=list.findIndex(b=>b.key===key);
  const book=getBook(nav.volumeId,nav.bookId);
  const chapter=getChapter(nav.volumeId,nav.bookId,nav.chapterNum);
  const label=(chapter.title?chapter.title:(book.name+' '+nav.chapterNum))+' : '+(nav.verseIdx+1);
  if(idx>=0) list.splice(idx,1);
  else list.unshift({key,volumeId:nav.volumeId,bookId:nav.bookId,chapterNum:nav.chapterNum,verseIdx:nav.verseIdx,label,ts:Date.now()});
  saveJSON('gl_bookmarks',list.slice(0,12));
  renderBookmarkFlag();
}

/* ── Navigation history ── */
function showScreen(id, push){
  if(push !== false){
    const cur = document.querySelector('.screen.active');
    if(cur && cur.id !== id) navHistory.push(cur.id);
  }
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  const first = document.getElementById(id).querySelector('.focusable');
  if(first) first.focus();
}
function goBack(){
  const prev = navHistory.pop();
  showScreen(prev || 'home', false);
}

/* ── Row builder ── */
function makeRow(label, sub, onSelect, empty){
  const row = document.createElement('div');
  row.className = 'card-row focusable' + (empty?' empty':'');
  row.tabIndex = 0;
  row.innerHTML = `<div><div class="label">${label}</div>${sub?`<div class="sub">${sub}</div>`:''}</div><div class="chev">›</div>`;
  row.addEventListener('click', onSelect);
  return row;
}

/* ── Home ── */
function wirePills(screenId){
  document.querySelectorAll('#'+screenId+' .pill').forEach(p=>{
    p.onclick = ()=>{
      const t = p.dataset.nav;
      if(p.classList.contains('active')) return;
      if(t==='home'){ navHistory.length=0; showScreen('home', false); return; }
      if(t==='library'){ renderLibrary(); showScreen('library'); return; }
      renderRecents(t==='bookmarks');
      showScreen('recents');
      if(t==='bookmarks'){
        const first = document.querySelector('#recentsList .bm-first');
        if(first){ first.focus(); first.scrollIntoView({block:'center'}); }
      }
    };
  });
}

/* Verse of the day. Fixed for now; swap for a rotation later. */
const VOTD = { volumeId:'bom', bookId:'alma', chapterNum:13, verseIdx:3 };

function renderVotd(){
  const el = document.getElementById('homeVotd');
  let text = '', ref = '';
  try {
    const ch = getChapter(VOTD.volumeId, VOTD.bookId, VOTD.chapterNum);
    const book = getBook(VOTD.volumeId, VOTD.bookId);
    text = verseText(ch.verses[VOTD.verseIdx]);
    ref  = `${book.name} ${VOTD.chapterNum}:${VOTD.verseIdx + 1}`;
  } catch(e) {
    el.style.display = 'none';
    return;
  }
  el.style.display = '';
  el.innerHTML = `<div class="votd-txt">${text}</div>`
               + `<div class="votd-ref">${ref}</div>`;
  el.onclick = ()=>{
    nav = { volumeId:VOTD.volumeId, bookId:VOTD.bookId,
            chapterNum:VOTD.chapterNum, verseIdx:VOTD.verseIdx };
    openReader();
  };
}

function renderMusic(){
  const el = document.getElementById('homeMusic');
  const vol = getVolume('hymns');
  if(!vol || !vol.books.length){ el.style.display = 'none'; return; }
  el.style.display = '';
  el.innerHTML =
      `<div class="music-cover">`
    +   `<img src="covers/hymns.jpg" alt="Hymns" onerror="this.style.display='none'">`
    + `</div>`
    + `<div class="hero-info">`
    +   `<div class="music-kicker">Music</div>`
    +   `<div class="music-title">Hymns</div>`
    + `</div>`;
  el.onclick = ()=>{ nav.volumeId = 'hymns'; nav.bookId = 'hymns'; renderChapters(); showScreen('chapters'); };
}

function renderHome(){
  wirePills('home');
  renderVotd();
  renderMusic();

  const hero = document.getElementById('homeHero');
  const rec = recents();
  if(rec.length){
    const r = rec[0];
    const ch = getChapter(r.volumeId, r.bookId, r.chapterNum);
    const total = (ch && ch.verses.length) || 1;
    const pct = Math.min(100, Math.round(((r.verseIdx+1)/total)*100));
    const cov = VOL_COVERS[r.volumeId] || { bg:'#22242B' };
    hero.innerHTML = `
      <div class="hero-cover" style="background:${cov.bg}">
        <img class="vol-card-img" src="covers/${r.volumeId}.jpg" alt="">
        ${coverArt(r.volumeId, r.volumeName, 92)}
      </div>
      <div class="hero-info">
        <div class="hero-kicker">Continue reading</div>
        <div class="hero-title">${r.label}</div>
        <div class="hero-sub">${r.volumeName} · Verse ${r.verseIdx+1}</div>
        <div class="hero-prog"><div class="bar"><i style="width:${pct}%"></i></div><span class="hero-pct">${pct}%</span></div>
      </div>`;
    const hImg = hero.querySelector('.hero-cover .vol-card-img');
    const hArt = hero.querySelector('.hero-cover .cover-art');
    if(hArt) hArt.style.display = 'none';
    if(hImg){
      hImg.onerror = ()=>{ hImg.style.display='none'; if(hArt) hArt.style.display=''; };
      hImg.onload  = ()=>{ if(hArt) hArt.style.display='none'; };
    }
    hero.onclick = ()=>{ nav={volumeId:r.volumeId,bookId:r.bookId,chapterNum:r.chapterNum,verseIdx:r.verseIdx}; openReader(); };
  } else {
    hero.innerHTML = `
      <div class="hero-info">
        <div class="hero-kicker">Welcome</div>
        <div class="hero-title">Start reading</div>
        <div class="hero-sub">Choose a volume from the Library</div>
      </div>`;
    hero.onclick = ()=>{ renderLibrary(); showScreen('library'); };
  }

  const chips = document.getElementById('homeRecentChips');
  const lbl = document.getElementById('homeRecentsLabel');
  lbl.onclick = ()=>{ renderRecents(false); showScreen('recents'); };
  chips.innerHTML = '';
  const rest = rec.slice(1,4);
  lbl.style.display = rest.length ? '' : 'none';
  rest.forEach(r=>{
    const c = document.createElement('button');
    c.className = 'rchip focusable';
    c.tabIndex = 0;
    c.innerHTML = `${chipIcon(r.kind)}${r.label}`;
    c.onclick = ()=>{ nav={volumeId:r.volumeId,bookId:r.bookId,chapterNum:r.chapterNum,verseIdx:r.verseIdx}; openReader(); };
    chips.appendChild(c);
  });
}

/* ── Vol cover palette ── */
const VOL_COVERS = {
  'ot':     { bg:'#000000', fg:'#F0EBE0', lines:['Old','Testament'],            dot:'#7A3040' },
  'nt':     { bg:'#000000', fg:'#F0EBE0', lines:['New','Testament'],            dot:'#2A6048' },
  'bom':    { bg:'#1B3A5C', fg:'#F0EBE0', lines:['The','Book','of','Mormon'],   dot:'#1B3A5C' },
  'dc':     { bg:'#000000', fg:'#F0EBE0', lines:['Doctrine','and','Covenants'], dot:'#4A4F58' },
  'pgp':    { bg:'#000000', fg:'#F0EBE0', lines:['Pearl of','Great Price'],     dot:'#4E3E7A' },
  'bd':     { bg:'#000000', fg:'#F0EBE0', lines:['Bible','Dictionary'],         dot:'#7A5230' },
  'gts':    { bg:'#000000', fg:'#F0EBE0', lines:['Guide to the','Scriptures'],  dot:'#265258' },
  'family': { bg:'#000000', fg:'#F0EBE0', lines:['Family','Library'],           dot:'#6A4A30' },
  'hymns':  { bg:'#1A1208', fg:'#F0EBE0', lines:['Hymns'],                      dot:'#C9A84C' },
};

/* Build cover art at any size. widthPx drives every proportion. */
function coverArt(volumeId, volumeName, widthPx){
  const cov = VOL_COVERS[volumeId] || {};
  const lines = cov.lines || [volumeName];
  return `<div class="cover-art" style="--cw:${widthPx}px">`
       +   `<div class="cover-art-title">${lines.join('<br>')}</div>`
       + `</div>`;
}

const CHIP_ICONS = {
  read:  '<path d="M12 6.5C10 5 7.5 4.6 4.5 4.8v12.6c3-.2 5.5.2 7.5 1.7 2-1.5 4.5-1.9 7.5-1.7V4.8c-3-.2-5.5.2-7.5 1.7z"/><path d="M12 6.5v12.6"/>',
  audio: '<path d="M4.5 15v-3a7.5 7.5 0 0 1 15 0v3"/><path d="M4.5 14.5h1.8a1 1 0 0 1 1 1v3.2a1 1 0 0 1-1 1H6a1.5 1.5 0 0 1-1.5-1.5v-3.7z"/><path d="M19.5 14.5h-1.8a1 1 0 0 0-1 1v3.2a1 1 0 0 0 1 1h.3a1.5 1.5 0 0 0 1.5-1.5v-3.7z"/>'
};
function chipIcon(kind){
  return `<svg class="rchip-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"`
       + ` stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">`
       + `${CHIP_ICONS[kind] || CHIP_ICONS.read}</svg>`;
}

/* ── Library ── */
function renderLibrary(){
  wirePills('library');
  const grid = document.getElementById('volGrid');
  grid.innerHTML = '';
  SCRIPTURES.volumes.filter(v => v.id !== 'hymns').forEach(v=>{
    const cover = VOL_COVERS[v.id] || { bg:'#0C0C10', fg:'#C9A84C' };
    const wrap = document.createElement('div');
    wrap.className = 'vol-wrap focusable' + (v.books.length===0?' empty':'');
    wrap.tabIndex = 0;

    const card = document.createElement('div');
    card.className = 'vol-card';
    card.style.setProperty('--cover-bg', cover.bg);
    card.style.setProperty('--cover-fg', cover.fg);

    // Cover photo image — falls back to CSS art if 404
    const fallback = document.createElement('div');
    fallback.innerHTML = coverArt(v.id, v.name, 92);

    const img = document.createElement('img');
    img.className = 'vol-card-img';
    img.src = 'covers/' + v.id + '.jpg';
    img.alt = v.name;
    img.onerror = function(){ this.style.display = 'none'; fallback.style.display = ''; };
    img.onload  = function(){ fallback.style.display = 'none'; };
    fallback.style.display = 'none';

    card.appendChild(img);
    card.appendChild(fallback);

    const lbl = document.createElement('div');
    lbl.className = 'vol-label';
    lbl.textContent = v.name;

    wrap.appendChild(card);
    wrap.appendChild(lbl);
    wrap.addEventListener('click', ()=>{
      if(!v.books.length) return;
      nav.volumeId = v.id; renderBooks(); showScreen('books');
    });
    grid.appendChild(wrap);
  });
}

/* ── Recents ── */
function renderRecents(focusBookmarks){
  const list = document.getElementById('recentsList');
  list.innerHTML = '';

  const rec = recents().slice().sort((a,b)=>(b.ts||0)-(a.ts||0));
  const lbl1 = document.createElement('div'); lbl1.className='section-label'; lbl1.textContent='Continue Reading';
  list.appendChild(lbl1);
  if(rec.length){
    const chipWrap = document.createElement('div');
    chipWrap.className = 'recent-chips';
    rec.forEach(r=>{
      const c = document.createElement('button');
      c.className = 'rchip focusable'; c.tabIndex = 0;
      c.innerHTML = `${chipIcon(r.kind)}${r.label}`;
      c.onclick = ()=>{ nav={volumeId:r.volumeId,bookId:r.bookId,chapterNum:r.chapterNum,verseIdx:r.verseIdx}; openReader(); };
      chipWrap.appendChild(c);
    });
    list.appendChild(chipWrap);
  } else {
    const n = document.createElement('div'); n.className='recents-note';
    n.textContent = 'Chapters you open will appear here.';
    list.appendChild(n);
  }

  const bm = bookmarks();
  if(bm.length){
    const lbl2 = document.createElement('div'); lbl2.className='section-label'; lbl2.textContent='Bookmarks';
    list.appendChild(lbl2);
    const bmWrap = document.createElement('div'); bmWrap.className='card-list'; bmWrap.style.cssText='flex:unset;overflow:unset;padding:0;margin:0;gap:8px';
    bm.forEach((b,i)=>{
      const row = makeRow(b.label, 'Bookmark', ()=>{
        nav={volumeId:b.volumeId,bookId:b.bookId,chapterNum:b.chapterNum,verseIdx:b.verseIdx}; openReader();
      });
      if(i===0) row.classList.add('bm-first');
      bmWrap.appendChild(row);
    });
    list.appendChild(bmWrap);
  }
}

/* ── Books ── */
function renderBooks(){
  const vol = getVolume(nav.volumeId);
  document.getElementById('booksTitle').textContent = vol.name;
  document.getElementById('booksBackLabel').textContent = 'Library';
  const list = document.getElementById('booksList');
  list.innerHTML = '';
  vol.books.forEach(b=>list.appendChild(makeRow(b.name, null, ()=>{
    nav.bookId = b.id; renderChapters(); showScreen('chapters');
  })));
}

/* ── Hymn jump-to-number ── */
let hymnJumpDigits = '';

function hymnJumpOpen(){
  document.getElementById('hymnSearchBtn').classList.add('open');
  document.getElementById('hymnKeypad').classList.add('open');
  hymnJumpDigits = '';
  hymnJumpRender();
  document.querySelector('#hymnKeypad .key').focus();
}
function hymnJumpClose(){
  document.getElementById('hymnSearchBtn').classList.remove('open');
  document.getElementById('hymnKeypad').classList.remove('open');
  document.getElementById('hymnSearchLabel').textContent = 'Jump to hymn number…';
  document.getElementById('hymnSearchBtn').focus();
}
function hymnJumpRender(){
  const label = document.getElementById('hymnSearchLabel');
  const preview = document.getElementById('hymnPreview');
  label.innerHTML = hymnJumpDigits
    ? `<span class="digits">${hymnJumpDigits}</span>`
    : 'Jump to hymn number…';

  if(!hymnJumpDigits){ preview.innerHTML = '&nbsp;'; return; }
  const num = parseInt(hymnJumpDigits, 10);
  const book = getBook('hymns', getVolume('hymns').books[0].id);
  const ch = book.chapters.find(c => c.num === num);
  preview.textContent = ch ? `Hymn ${num} · ${ch.title}` : `No hymn ${num}`;
}
function hymnJumpKey(k){
  if(k === 'back'){ hymnJumpDigits = hymnJumpDigits.slice(0,-1); hymnJumpRender(); return; }
  if(k === 'go'){ hymnJumpGo(); return; }
  if(hymnJumpDigits.length >= 3) return;
  hymnJumpDigits += k;
  hymnJumpRender();
}
function hymnJumpGo(){
  const num = parseInt(hymnJumpDigits, 10);
  if(!num) return;
  const bookId = getVolume('hymns').books[0].id;
  const book = getBook('hymns', bookId);
  const ch = book.chapters.find(c => c.num === num);
  if(!ch) return;
  nav.volumeId = 'hymns'; nav.bookId = bookId;
  nav.chapterNum = num; nav.verseIdx = 0;
  openReader();
}

document.getElementById('hymnSearchBtn').addEventListener('click', hymnJumpOpen);
document.querySelectorAll('#hymnKeypad .key').forEach(btn=>{
  btn.addEventListener('click', ()=> hymnJumpKey(btn.dataset.key));
});
document.addEventListener('keydown', e=>{
  if(e.key === 'Escape' && document.getElementById('hymnKeypad').classList.contains('open')){
    hymnJumpClose(); e.preventDefault();
  }
});

/* ── Chapters ── */
function renderChapters(){
  const book = getBook(nav.volumeId, nav.bookId);
  document.getElementById('chaptersTitle').textContent = book.name;
  document.getElementById('chaptersBackLabel').textContent = getVolume(nav.volumeId).name;

  const isHymnBook = nav.volumeId === 'hymns';
  document.getElementById('hymnSearchBtn').classList.toggle('shown', isHymnBook);
  if(!isHymnBook) hymnJumpClose();

  const grid = document.getElementById('chaptersGrid');
  grid.innerHTML = '';
  const hasTitles = book.chapters.some(c=>c.title);
  grid.classList.toggle('list-mode', hasTitles);
  book.chapters.forEach(c=>{
    const isEmpty = c.verses.length===0;
    const el = document.createElement('div');
    el.className = (hasTitles?'card-row':'chip') + ' focusable' + (isEmpty?' empty':'');
    el.tabIndex = 0;
    if(hasTitles){
      const numBadge = (nav.volumeId==='hymns')
        ? `<span style="font-size:11px;color:var(--ink-dim);margin-right:8px;font-variant-numeric:tabular-nums">${c.num}</span>`
        : '';
      el.innerHTML=`<div><div class="label">${numBadge}${c.title}</div></div><div class="chev">›</div>`;
    }
    else el.textContent = c.num;
    el.addEventListener('click',()=>{ if(isEmpty) return; nav.chapterNum=c.num; nav.verseIdx=0; openReader(); });
    grid.appendChild(el);
  });
}

/* ── Reader ── */
function openReader(){ showScreen('reader'); renderChapterContent(); }
function renderChapterContent(){
  const book = getBook(nav.volumeId, nav.bookId);
  const chapter = getChapter(nav.volumeId, nav.bookId, nav.chapterNum);
  const isHymn = nav.volumeId === 'hymns';
  document.getElementById('refTag').textContent =
    isHymn ? 'Hymn ' + nav.chapterNum :
    chapter.title ? chapter.title : (book.name + ' · ' + nav.chapterNum);
  const scroll = document.getElementById('chapterScroll');
  scroll.dataset.volume = nav.volumeId;
  scroll.innerHTML = '';
  if(!chapter.verses.length){
    const e = document.createElement('div'); e.className='empty-state';
    e.textContent = 'No text loaded for this chapter yet.';
    scroll.appendChild(e);
    document.getElementById('verseCounter').textContent = '';
    document.getElementById('bookmarkFlag').classList.remove('on');
    return;
  }
  const hdr = document.createElement('div');
  hdr.className = 'chapter-header';
  const chapterWord = nav.volumeId === 'dc' ? 'Section' : 'Chapter';
  if(chapter.title){
    hdr.innerHTML = (isHymn ? `<div class="chapter-book-name">Hymn ${nav.chapterNum}</div>` : '')
      + `<div class="chapter-intro">${chapter.title}</div>`
      + (chapter.heading ? `<div class="chapter-summary">${chapter.heading}</div>` : '');
  } else {
    hdr.innerHTML = `
      <div class="chapter-book-name">${book.name}</div>
      <div class="chapter-number-large">${chapterWord} ${nav.chapterNum}</div>
      ${chapter.heading ? `<div class="chapter-summary">${chapter.heading}</div>` : ''}
    `;
  }
  scroll.appendChild(hdr);

  chapter.verses.forEach((v,i)=>{
    const row = document.createElement('div');
    row.className = 'verse-row'; row.dataset.idx = i;
    row.innerHTML = `<div class="verse-body"><span class="verse-num">${i+1}</span> ${verseText(v)}</div>`;
    scroll.appendChild(row);
  });
  requestAnimationFrame(()=>updateVerseUI(false));
}
function updateVerseUI(smooth){
  const scroll = document.getElementById('chapterScroll');
  const chapter = getChapter(nav.volumeId, nav.bookId, nav.chapterNum);
  scroll.querySelectorAll('.verse-row').forEach(el=>{
    el.classList.toggle('current', parseInt(el.dataset.idx)===nav.verseIdx);
  });
  const cur = scroll.querySelector('.verse-row.current');
  if(cur) cur.scrollIntoView({block:'center',behavior:smooth?'smooth':'instant'});
  document.getElementById('verseCounter').textContent = (nav.verseIdx+1)+' / '+chapter.verses.length;
  renderBookmarkFlag(); touchRecent();
}
function renderBookmarkFlag(){
  const on = isBookmarked();
  const flag = document.getElementById('bookmarkFlag');
  flag.classList.toggle('on', on);
  flag.textContent = on ? '◆' : '◇';
  document.getElementById('bookmarkLabel').textContent = on?'Remove bookmark':'Bookmark verse';
}
function stepVerse(d){
  const ch = getChapter(nav.volumeId, nav.bookId, nav.chapterNum);
  if(!ch.verses.length) return;
  nav.verseIdx = Math.max(0, Math.min(ch.verses.length-1, nav.verseIdx+d));
  updateVerseUI(true);
}
function stepChapter(d){
  const book = getBook(nav.volumeId, nav.bookId);
  const idx = book.chapters.findIndex(c=>c.num===nav.chapterNum);
  const next = (idx+d+book.chapters.length)%book.chapters.length;
  nav.chapterNum = book.chapters[next].num; nav.verseIdx = 0;
  renderChapterContent();
}

/* ── Menu ── */
function visibleMenuBtns(){ return Array.from(document.querySelectorAll('#menu .focusable')).filter(el=>el.style.display!=='none'); }
function openMenu(){
  menuOpen = true;
  const ch = getChapter(nav.volumeId, nav.bookId, nav.chapterNum);
  const book = getBook(nav.volumeId, nav.bookId);
  const bBtn = document.querySelector('.menu-btn[data-action="bookmark"]');
  bBtn.style.display = ch.verses.length===0?'none':'flex';
  const ref = ch.title ? ch.title : book.name + ' ' + nav.chapterNum;
  document.getElementById('menuRef').textContent = ch.verses.length ? ref + ' : ' + (nav.verseIdx+1) : ref;
  const pv = document.getElementById('menuVersePreview');
  if(ch.verses.length){
    const t = verseText(ch.verses[nav.verseIdx]);
    pv.textContent = t.length > 90 ? t.slice(0, 90).trimEnd() + '…' : t;
    pv.style.display = '';
  } else {
    pv.style.display = 'none';
  }
  document.getElementById('menu').classList.add('active');
  const first = visibleMenuBtns()[0]; if(first) first.focus();
}
function closeMenu(){ menuOpen=false; document.getElementById('menu').classList.remove('active'); }
document.querySelectorAll('#menu .menu-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const a = btn.dataset.action;
    if(a==='resume') closeMenu();
    else if(a==='bookmark'){ toggleBookmark(); closeMenu(); }
    else if(a==='chapters'){ closeMenu(); renderChapters(); showScreen('chapters', false); }
    else if(a==='home'){ closeMenu(); navHistory.length=0; showScreen('home', false); }
  });
});

/* ── Focus helpers ── */
function visibleFocusables(scope){
  return Array.from(scope.querySelectorAll('.focusable')).filter(el=>{
    let n=el;
    while(n && n!==scope){
      if(getComputedStyle(n).display==='none') return false;
      n=n.parentElement;
    }
    return true;
  });
}

/* Group items into rows by their Y position (for 2D grid nav) */
function getGridRows(items){
  const rows = [];
  for(const item of items){
    const top = Math.round(item.getBoundingClientRect().top);
    const lastRow = rows[rows.length-1];
    if(lastRow && Math.abs(lastRow[0].getBoundingClientRect().top - top) < 10){
      lastRow.push(item);
    } else {
      rows.push([item]);
    }
  }
  return rows;
}

/* ── 2D grid move ── */
function moveInGrid(gridItems, allItems, dir){
  const cur = document.activeElement;
  const rows = getGridRows(gridItems);
  let rowIdx=-1, colIdx=-1;
  for(let r=0;r<rows.length;r++){
    const c=rows[r].indexOf(cur);
    if(c!==-1){ rowIdx=r; colIdx=c; break; }
  }
  if(rowIdx===-1){ gridItems[0].focus(); return; }

  let target = null;
  if(dir==='left'){
    if(colIdx>0) target = rows[rowIdx][colIdx-1];
    else {
      /* left edge: go to the nearest non-grid item above (back button etc.) */
      const gridStart = allItems.indexOf(gridItems[0]);
      if(gridStart>0) target = allItems[gridStart-1];
    }
  } else if(dir==='right'){
    if(colIdx < rows[rowIdx].length-1) target = rows[rowIdx][colIdx+1];
    else if(rowIdx < rows.length-1)    target = rows[rowIdx+1][0];
  } else if(dir==='up'){
    if(rowIdx>0){
      const pr = rows[rowIdx-1];
      target = pr[Math.min(colIdx, pr.length-1)];
    } else {
      const gridStart = allItems.indexOf(gridItems[0]);
      if(gridStart>0) target = allItems[gridStart-1];
    }
  } else if(dir==='down'){
    if(rowIdx < rows.length-1){
      const nr = rows[rowIdx+1];
      target = nr[Math.min(colIdx, nr.length-1)];
    }
  }

  if(target){ target.focus(); target.scrollIntoView({block:'nearest',behavior:'smooth'}); }
}

/* ── Main move focus ── */
function moveFocus(dir){
  const scope = menuOpen ? document.getElementById('menu') : document.querySelector('.screen.active');
  const items = visibleFocusables(scope);
  if(!items.length) return;

  const cur = document.activeElement;

  /* Check if in a 2D grid context */
  const volGrid    = cur.closest('.vol-grid');
  const chipGrid   = cur.closest('.chip-grid:not(.list-mode)');
  const keypadGrid = cur.closest('.keypad-grid');
  const pillScreen = (!volGrid && !chipGrid && !keypadGrid && scope.querySelector && scope.querySelector('.pill-bar')) ? scope : null;
  const gridHost = volGrid || chipGrid || keypadGrid || pillScreen;

  if(gridHost){
    const gridItems = items.filter(el=>gridHost.contains(el));
    moveInGrid(gridItems, items, dir);
    return;
  }

  /* 1D list navigation */
  const idx = items.indexOf(cur);
  if(idx===-1){ items[0].focus(); return; }
  const next = (dir==='up'||dir==='left')
    ? (idx>0 ? idx-1 : items.length-1)
    : (idx<items.length-1 ? idx+1 : 0);
  items[next].focus();
  items[next].scrollIntoView({block:'nearest',behavior:'smooth'});
}

/* ── Keyboard ── */
const DPAD = {UP:'ArrowUp',DOWN:'ArrowDown',LEFT:'ArrowLeft',RIGHT:'ArrowRight',SELECT:'Enter'};
document.addEventListener('keydown', e=>{
  const onReader = document.getElementById('reader').classList.contains('active');
  if(onReader && !menuOpen){
    switch(e.key){
      case DPAD.UP:    stepVerse(-1);   break;
      case DPAD.DOWN:  stepVerse(1);    break;
      case DPAD.LEFT:  stepChapter(-1); break;
      case DPAD.RIGHT: stepChapter(1);  break;
      case DPAD.SELECT: openMenu();     break;
      default: return;
    }
    e.preventDefault(); return;
  }
  switch(e.key){
    case DPAD.UP:    moveFocus('up');    break;
    case DPAD.DOWN:  moveFocus('down');  break;
    case DPAD.LEFT:  moveFocus('left');  break;
    case DPAD.RIGHT: moveFocus('right'); break;
    case DPAD.SELECT:
      if(document.activeElement.classList.contains('focusable')) document.activeElement.click();
      break;
    default: return;
  }
  e.preventDefault();
});

loadLibrary();
