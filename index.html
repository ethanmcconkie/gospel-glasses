<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="description" content="A scripture study companion for Meta Ray-Ban Display glasses">
<meta name="mrbd-web-app-capable" content="yes">
<meta property="og:image" content="icon.svg">
<meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<title>Bookshelf</title>
<style>
  :root {
    --bg: #000;
    --card: rgba(255,255,255,0.055);
    --card-hi: rgba(79,168,232,0.13);
    --ink: #F2F2F7;
    --ink-dim: rgba(242,242,247,0.42);
    --accent: #4FA8E8;
    --accent-border: rgba(79,168,232,0.65);
    --divider: rgba(255,255,255,0.08);
    --font: 'Noto Serif', Georgia, serif;
    --ease: cubic-bezier(0.4, 0, 0.2, 1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 600px; height: 600px;
    background: var(--bg); color: var(--ink);
    overflow: hidden; font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }
  #app { position: relative; width: 600px; height: 600px; }

  /* ── Screen transitions (visibility trick so transform animates) ── */
  .screen {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    padding: 32px 24px 20px;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: translateY(14px);
    transition:
      opacity    260ms var(--ease),
      transform  260ms var(--ease),
      visibility 0s    260ms;
  }
  .screen.active {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transform: translateY(0);
    transition:
      opacity    260ms var(--ease),
      transform  260ms var(--ease),
      visibility 0s    0s;
  }

  /* ── Boot / loading ── */
  #boot { justify-content: center; align-items: center; gap: 22px; }

  .spinner { position: relative; width: 54px; height: 54px; }
  .spinner-track {
    position: absolute; inset: 0; border-radius: 50%;
    border: 2.5px solid rgba(79,168,232,0.14);
  }
  @keyframes arc-spin { to { transform: rotate(360deg); } }
  .spinner-arc {
    position: absolute; inset: 0; border-radius: 50%;
    border: 2.5px solid transparent;
    border-top-color: var(--accent);
    border-right-color: rgba(79,168,232,0.35);
    animation: arc-spin 0.88s cubic-bezier(0.4,0,0.2,1) infinite;
  }

  .boot-wordmark { font-size: 22px; font-weight: 600; color: var(--ink); letter-spacing: -0.3px; }
  .boot-status   { font-size: 13px; color: var(--ink-dim); letter-spacing: 0.1px; min-height: 19px; }
  .boot-error    { color: #FF6B6B; font-size: 13px; max-width: 440px; text-align: center; }

  /* ── Screen header ── */
  .eyebrow {
    font-size: 11px; letter-spacing: 2px;
    text-transform: uppercase; color: var(--ink-dim); margin-bottom: 5px;
  }
  .title {
    font-size: 28px; font-weight: 600; letter-spacing: -0.4px;
    line-height: 1.1; color: var(--ink); margin-bottom: 20px;
  }

  /* ── Card list rows ── */
  .list {
    flex: 1; overflow-y: auto;
    display: flex; flex-direction: column; gap: 8px;
  }
  .list::-webkit-scrollbar { display: none; }

  .row {
    min-height: 68px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px 14px 18px;
    background: var(--card);
    border-radius: 14px;
    border: 1.5px solid transparent;
    cursor: pointer;
    transition:
      background    200ms var(--ease),
      border-color  200ms var(--ease),
      box-shadow    200ms var(--ease);
  }
  .row .label { font-size: 18px; font-weight: 400; color: var(--ink); line-height: 1.3; }
  .row .sub   { font-size: 13px; color: var(--ink-dim); margin-top: 3px; }
  .row .chev  { font-size: 20px; color: var(--ink-dim); margin-left: 10px; flex-shrink: 0; }
  .row:focus {
    outline: none;
    background: var(--card-hi);
    border-color: var(--accent-border);
    box-shadow: 0 0 0 1px rgba(79,168,232,0.08), 0 4px 24px rgba(79,168,232,0.12);
  }
  .row:focus .chev { color: var(--accent); }
  .row.empty { opacity: 0.32; pointer-events: none; }

  /* ── Chapter chips ── */
  .grid {
    display: flex; flex-wrap: wrap; gap: 8px;
    overflow-y: auto; flex: 1; align-content: flex-start;
  }
  .grid::-webkit-scrollbar { display: none; }
  .grid.list-mode { flex-wrap: nowrap; flex-direction: column; gap: 8px; }
  .grid.list-mode .row { width: 100%; }

  .chip {
    width: 64px; height: 64px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; color: var(--ink);
    background: var(--card);
    border-radius: 14px;
    border: 1.5px solid transparent;
    cursor: pointer;
    transition:
      background   200ms var(--ease),
      border-color 200ms var(--ease),
      box-shadow   200ms var(--ease);
  }
  .chip:focus {
    outline: none;
    background: var(--card-hi);
    border-color: var(--accent-border);
    box-shadow: 0 0 0 1px rgba(79,168,232,0.08), 0 4px 24px rgba(79,168,232,0.12);
  }
  .chip.empty { opacity: 0.32; pointer-events: none; }

  /* ── Reader ── */
  #reader { padding: 22px 22px 16px; }

  .reader-header {
    display: flex; align-items: center; gap: 10px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--divider);
    flex-shrink: 0;
  }
  .ref-tag {
    font-size: 15px; font-weight: 600; color: var(--accent);
    letter-spacing: 0.1px; flex: 1; line-height: 1.2;
  }
  .verse-counter {
    font-size: 12px; color: var(--ink-dim);
    background: rgba(255,255,255,0.07);
    padding: 3px 10px; border-radius: 20px; flex-shrink: 0;
  }
  .bookmark-flag { font-size: 18px; color: var(--ink-dim); flex-shrink: 0; }
  .bookmark-flag.on { color: var(--accent); }

  .chapter-scroll {
    flex: 1; overflow-y: auto; padding: 14px 0 20px;
    scrollbar-width: none;
  }
  .chapter-scroll::-webkit-scrollbar { display: none; }

  /* Verses render like printed scripture — number inline as superscript */
  .verse-row {
    padding: 7px 12px 7px 13px;
    margin-bottom: 3px;
    border-left: 3px solid transparent;
    border-radius: 0 10px 10px 0;
    transition: border-color 200ms var(--ease), background 200ms var(--ease);
  }
  .verse-row.current {
    border-left-color: var(--accent);
    background: rgba(79,168,232,0.09);
  }
  .verse-body {
    font-size: 20px; line-height: 1.75; color: var(--ink);
  }
  .verse-num {
    font-size: 11px; font-weight: 700; color: var(--accent);
    vertical-align: super; line-height: 0;
    margin-right: 2px; letter-spacing: 0.2px;
  }

  .empty-state {
    padding: 48px 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; gap: 8px;
    color: var(--ink-dim); font-size: 14px;
  }

  /* ── Menu overlay ── */
  #menu {
    position: absolute; inset: 0; display: none;
    background: rgba(0,0,0,0.88);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    flex-direction: column; justify-content: center;
    padding: 0 44px;
  }
  #menu.active { display: flex; }

  .menu-inner {
    border-radius: 16px;
    border: 1px solid var(--divider);
    overflow: hidden;
  }
  .menu-btn {
    min-height: 60px; display: flex; align-items: center; gap: 16px;
    padding: 0 20px;
    border-bottom: 1px solid var(--divider);
    font-size: 17px; color: var(--ink);
    background: rgba(255,255,255,0.04);
    transition: background 160ms var(--ease);
    width: 100%;
  }
  .menu-btn:last-child { border-bottom: none; }
  .menu-btn:focus { outline: none; background: var(--card-hi); }
  .menu-icon { font-size: 15px; width: 22px; text-align: center; color: var(--accent); }
</style>
</head>
<body>
<div id="app">

  <!-- BOOT -->
  <section class="screen active" id="boot">
    <div class="spinner">
      <div class="spinner-track"></div>
      <div class="spinner-arc"></div>
    </div>
    <div class="boot-wordmark">Bookshelf</div>
    <div class="boot-status" id="bootStatus">Loading library…</div>
  </section>

  <!-- HOME -->
  <section class="screen" id="home">
    <div class="eyebrow">Bookshelf</div>
    <div class="title">Good to see you</div>
    <div class="list" id="homeList"></div>
  </section>

  <!-- LIBRARY -->
  <section class="screen" id="library">
    <div class="eyebrow">Library</div>
    <div class="title">Standard Works</div>
    <div class="list" id="libraryList"></div>
  </section>

  <!-- BOOKS -->
  <section class="screen" id="books">
    <div class="eyebrow" id="booksVolumeName">Volume</div>
    <div class="title" id="booksTitle">Books</div>
    <div class="list" id="booksList"></div>
  </section>

  <!-- CHAPTERS -->
  <section class="screen" id="chapters">
    <div class="eyebrow" id="chaptersBookName">Book</div>
    <div class="title">Chapters</div>
    <div class="grid" id="chaptersGrid"></div>
  </section>

  <!-- READER -->
  <section class="screen" id="reader">
    <div class="reader-header">
      <div class="ref-tag" id="refTag">—</div>
      <div class="verse-counter" id="verseCounter"></div>
      <div class="bookmark-flag" id="bookmarkFlag">♥</div>
    </div>
    <div class="chapter-scroll" id="chapterScroll"></div>
  </section>

  <!-- MENU OVERLAY -->
  <div id="menu">
    <div class="menu-inner">
      <button class="menu-btn focusable" data-action="resume"><span class="menu-icon">▸</span>Resume reading</button>
      <button class="menu-btn focusable" data-action="bookmark"><span class="menu-icon">♥</span><span id="bookmarkLabel">Bookmark this verse</span></button>
      <button class="menu-btn focusable" data-action="chapters"><span class="menu-icon">≡</span>Jump to chapter</button>
      <button class="menu-btn focusable" data-action="home"><span class="menu-icon">⌂</span>Back to Home</button>
    </div>
  </div>

</div>
<script>
/* ============ DATA ============ */
const SCRIPTURES = { volumes: [] };

async function loadLibrary(){
  const statusEl = document.getElementById('bootStatus');
  try {
    const manifestRes = await fetch('data/manifest.json');
    if (!manifestRes.ok) throw new Error('manifest.json not found (' + manifestRes.status + ')');
    const files = await manifestRes.json();
    for (const file of files){
      statusEl.textContent = 'Loading ' + file + '…';
      const res = await fetch('data/' + file);
      if (!res.ok) { console.warn('Skipping ' + file + ': ' + res.status); continue; }
      SCRIPTURES.volumes.push(await res.json());
    }
    renderHome(); renderLibrary(); showScreen('home');
  } catch(err){
    statusEl.textContent = '';
    const el = document.createElement('div');
    el.className = 'boot-error';
    el.textContent = 'Could not load the library (' + err.message + '). Serve over http(s) — see README.md.';
    document.getElementById('boot').appendChild(el);
  }
}

function getVolume(id){ return SCRIPTURES.volumes.find(v => v.id === id); }
function getBook(vId, bId){ return getVolume(vId).books.find(b => b.id === bId); }
function getChapter(vId, bId, num){ return getBook(vId, bId).chapters.find(c => c.num === num); }
function verseText(v){ return (typeof v === 'string') ? v : v.text; }

/* ============ STATE ============ */
let nav = { volumeId: null, bookId: null, chapterNum: null, verseIdx: 0 };
let menuOpen = false;

/* ============ PERSISTENCE ============ */
function loadJSON(key, fb){ try { const r = localStorage.getItem(key); return r ? JSON.parse(r) : fb; } catch(e){ return fb; } }
function saveJSON(key, val){ try { localStorage.setItem(key, JSON.stringify(val)); } catch(e){} }

function recents(){ return loadJSON('gl_recents', []).filter(entryStillValid); }
function bookmarks(){ return loadJSON('gl_bookmarks', []).filter(entryStillValid); }
function entryStillValid(e){
  const vol = getVolume(e.volumeId); if (!vol) return false;
  const book = getBook(e.volumeId, e.bookId); if (!book) return false;
  return !!book.chapters.find(c => c.num === e.chapterNum);
}
function verseKey(v,b,c,i){ return v+'|'+b+'|'+c+'|'+i; }

function touchRecent(){
  const vol = getVolume(nav.volumeId), book = getBook(nav.volumeId, nav.bookId);
  const chapter = getChapter(nav.volumeId, nav.bookId, nav.chapterNum);
  const label = chapter.title ? chapter.title : (book.name + ' ' + nav.chapterNum);
  let list = recents().filter(r => !(r.volumeId===nav.volumeId && r.bookId===nav.bookId && r.chapterNum===nav.chapterNum));
  list.unshift({ volumeId: nav.volumeId, bookId: nav.bookId, chapterNum: nav.chapterNum, verseIdx: nav.verseIdx, label, volumeName: vol.name, ts: Date.now() });
  saveJSON('gl_recents', list.slice(0, 6));
}

function isBookmarked(){ return bookmarks().some(b => b.key === verseKey(nav.volumeId, nav.bookId, nav.chapterNum, nav.verseIdx)); }

function toggleBookmark(){
  const key = verseKey(nav.volumeId, nav.bookId, nav.chapterNum, nav.verseIdx);
  let list = bookmarks();
  const idx = list.findIndex(b => b.key === key);
  const book = getBook(nav.volumeId, nav.bookId);
  const chapter = getChapter(nav.volumeId, nav.bookId, nav.chapterNum);
  const label = (chapter.title ? chapter.title : (book.name + ' ' + nav.chapterNum)) + ' : ' + (nav.verseIdx + 1);
  if (idx >= 0) list.splice(idx, 1);
  else list.unshift({ key, volumeId: nav.volumeId, bookId: nav.bookId, chapterNum: nav.chapterNum, verseIdx: nav.verseIdx, label, ts: Date.now() });
  saveJSON('gl_bookmarks', list.slice(0, 12));
  renderBookmarkFlag();
}

/* ============ SCREEN ROUTER ============ */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  const first = document.getElementById(id).querySelector('.focusable');
  if (first) first.focus();
}

/* ============ ROW BUILDER ============ */
function makeRow({label, sub, onSelect, empty}){
  const row = document.createElement('div');
  row.className = 'row focusable' + (empty ? ' empty' : '');
  row.tabIndex = 0;
  row.innerHTML = `<div><div class="label">${label}</div>${sub ? `<div class="sub">${sub}</div>` : ''}</div><div class="chev">›</div>`;
  row.addEventListener('click', onSelect);
  return row;
}

/* ============ HOME ============ */
function renderHome(){
  const list = document.getElementById('homeList');
  list.innerHTML = '';
  list.appendChild(makeRow({ label: 'Browse Library', sub: SCRIPTURES.volumes.map(v => v.name).join(' · '), onSelect: () => showScreen('library') }));
  const rec = recents();
  if (rec.length){
    rec.forEach(r => list.appendChild(makeRow({ label: r.label, sub: r.volumeName,
      onSelect: () => { nav = { volumeId: r.volumeId, bookId: r.bookId, chapterNum: r.chapterNum, verseIdx: r.verseIdx }; openReader(); } })));
  } else {
    const note = document.createElement('div');
    note.style.cssText = 'font-size:13px;color:var(--ink-dim);padding:4px 2px 0';
    note.textContent = 'Chapters you open will appear here.';
    list.appendChild(note);
  }
  bookmarks().forEach(b => list.appendChild(makeRow({ label: '♥ ' + b.label, sub: 'Bookmarked',
    onSelect: () => { nav = { volumeId: b.volumeId, bookId: b.bookId, chapterNum: b.chapterNum, verseIdx: b.verseIdx }; openReader(); } })));
}

/* ============ LIBRARY ============ */
function renderLibrary(){
  const list = document.getElementById('libraryList');
  list.innerHTML = '';
  SCRIPTURES.volumes.forEach(v => list.appendChild(makeRow({
    label: v.name, sub: v.books.length + (v.books.length === 1 ? ' book' : ' books'),
    empty: v.books.length === 0,
    onSelect: () => { if (!v.books.length) return; nav.volumeId = v.id; renderBooks(); showScreen('books'); }
  })));
}

/* ============ BOOKS ============ */
function renderBooks(){
  const vol = getVolume(nav.volumeId);
  document.getElementById('booksVolumeName').textContent = vol.name;
  document.getElementById('booksTitle').textContent = 'Books';
  const list = document.getElementById('booksList');
  list.innerHTML = '';
  vol.books.forEach(b => list.appendChild(makeRow({
    label: b.name, sub: b.chapters.length + (b.chapters.length === 1 ? ' chapter' : ' chapters'),
    onSelect: () => { nav.bookId = b.id; renderChapters(); showScreen('chapters'); }
  })));
}

/* ============ CHAPTERS ============ */
function renderChapters(){
  const book = getBook(nav.volumeId, nav.bookId);
  document.getElementById('chaptersBookName').textContent = book.name;
  const grid = document.getElementById('chaptersGrid');
  grid.innerHTML = '';
  const hasTitles = book.chapters.some(c => c.title);
  grid.classList.toggle('list-mode', hasTitles);
  book.chapters.forEach(c => {
    const isEmpty = c.verses.length === 0;
    const chip = document.createElement('div');
    chip.className = (hasTitles ? 'row' : 'chip') + ' focusable' + (isEmpty ? ' empty' : '');
    chip.tabIndex = 0;
    if (hasTitles) chip.innerHTML = `<div><div class="label">${c.title}</div></div><div class="chev">›</div>`;
    else chip.textContent = c.num;
    chip.addEventListener('click', () => { if (isEmpty) return; nav.chapterNum = c.num; nav.verseIdx = 0; openReader(); });
    grid.appendChild(chip);
  });
}

/* ============ READER — continuous scroll ============ */
function openReader(){
  showScreen('reader');
  renderChapterContent();
}

function renderChapterContent(){
  const book = getBook(nav.volumeId, nav.bookId);
  const chapter = getChapter(nav.volumeId, nav.bookId, nav.chapterNum);
  document.getElementById('refTag').textContent = chapter.title ? chapter.title : (book.name + ' ' + nav.chapterNum);

  const scroll = document.getElementById('chapterScroll');
  scroll.innerHTML = '';

  if (!chapter.verses.length){
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.textContent = 'No text loaded for this chapter yet.';
    scroll.appendChild(empty);
    document.getElementById('verseCounter').textContent = '';
    document.getElementById('bookmarkFlag').classList.remove('on');
    return;
  }

  chapter.verses.forEach((v, i) => {
    const row = document.createElement('div');
    row.className = 'verse-row';
    row.dataset.idx = i;
    row.innerHTML = `<div class="verse-body"><sup class="verse-num">${i + 1}</sup> ${verseText(v)}</div>`;
    scroll.appendChild(row);
  });

  requestAnimationFrame(() => updateVerseUI(false));
}

function updateVerseUI(smooth){
  const scroll = document.getElementById('chapterScroll');
  const chapter = getChapter(nav.volumeId, nav.bookId, nav.chapterNum);

  scroll.querySelectorAll('.verse-row').forEach(el => {
    el.classList.toggle('current', parseInt(el.dataset.idx) === nav.verseIdx);
  });

  const currentEl = scroll.querySelector('.verse-row.current');
  if (currentEl) currentEl.scrollIntoView({ block: 'center', behavior: smooth ? 'smooth' : 'instant' });

  document.getElementById('verseCounter').textContent = (nav.verseIdx + 1) + ' / ' + chapter.verses.length;
  renderBookmarkFlag();
  touchRecent();
}

function renderBookmarkFlag(){
  const on = isBookmarked();
  document.getElementById('bookmarkFlag').classList.toggle('on', on);
  document.getElementById('bookmarkLabel').textContent = on ? 'Remove bookmark' : 'Bookmark this verse';
}

function stepVerse(delta){
  const chapter = getChapter(nav.volumeId, nav.bookId, nav.chapterNum);
  if (!chapter.verses.length) return;
  nav.verseIdx = Math.max(0, Math.min(chapter.verses.length - 1, nav.verseIdx + delta));
  updateVerseUI(true);
}

function stepChapter(delta){
  const book = getBook(nav.volumeId, nav.bookId);
  const idx = book.chapters.findIndex(c => c.num === nav.chapterNum);
  const next = (idx + delta + book.chapters.length) % book.chapters.length;
  nav.chapterNum = book.chapters[next].num;
  nav.verseIdx = 0;
  renderChapterContent();
}

/* ============ MENU ============ */
function visibleMenuBtns(){ return Array.from(document.querySelectorAll('#menu .focusable')).filter(el => el.style.display !== 'none'); }

function openMenu(){
  menuOpen = true;
  const chapter = getChapter(nav.volumeId, nav.bookId, nav.chapterNum);
  const bookmarkBtn = document.querySelector('.menu-btn[data-action="bookmark"]');
  bookmarkBtn.style.display = chapter.verses.length === 0 ? 'none' : 'flex';
  document.getElementById('menu').classList.add('active');
  const first = visibleMenuBtns()[0];
  if (first) first.focus();
}
function closeMenu(){
  menuOpen = false;
  document.getElementById('menu').classList.remove('active');
}

document.querySelectorAll('#menu .menu-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const a = btn.dataset.action;
    if (a === 'resume') closeMenu();
    else if (a === 'bookmark') { toggleBookmark(); closeMenu(); }
    else if (a === 'chapters') { closeMenu(); renderChapters(); showScreen('chapters'); }
    else if (a === 'home') { closeMenu(); renderHome(); showScreen('home'); }
  });
});

/* ============ FOCUS NAVIGATION ============ */
function activeScope(){ return menuOpen ? document.getElementById('menu') : document.querySelector('.screen.active'); }

function moveFocus(dir){
  const scope = activeScope();
  const items = menuOpen
    ? visibleMenuBtns()
    : Array.from(scope.querySelectorAll('.focusable'));
  if (!items.length) return;
  const idx = items.indexOf(document.activeElement);
  if (idx === -1) { items[0].focus(); return; }
  const next = (dir === 'up' || dir === 'left')
    ? (idx > 0 ? idx - 1 : items.length - 1)
    : (idx < items.length - 1 ? idx + 1 : 0);
  items[next].focus();
  items[next].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

const DPAD = { UP:'ArrowUp', DOWN:'ArrowDown', LEFT:'ArrowLeft', RIGHT:'ArrowRight', SELECT:'Enter' };

document.addEventListener('keydown', function(e){
  const onReader = document.getElementById('reader').classList.contains('active');

  if (onReader && !menuOpen){
    switch(e.key){
      case DPAD.UP:     stepVerse(-1);   break;
      case DPAD.DOWN:   stepVerse(1);    break;
      case DPAD.LEFT:   stepChapter(-1); break;
      case DPAD.RIGHT:  stepChapter(1);  break;
      case DPAD.SELECT: openMenu();      break;
      default: return;
    }
    e.preventDefault(); return;
  }

  switch(e.key){
    case DPAD.UP:    moveFocus('up');    break;
    case DPAD.DOWN:  moveFocus('down');  break;
    case DPAD.LEFT:  moveFocus('left');  break;
    case DPAD.RIGHT: moveFocus('right'); break;
    case DPAD.SELECT:
      if (document.activeElement.classList.contains('focusable')) document.activeElement.click();
      break;
    default: return;
  }
  e.preventDefault();
});

/* ============ INIT ============ */
