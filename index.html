<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="description" content="A scripture study companion for Meta Ray-Ban Display glasses">
<meta name="mrbd-web-app-capable" content="yes">
<meta property="og:image" content="https://ethanmcconkie.github.io/gospel-glasses/icon.png">
<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">
<meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
<link rel="icon" href="icon-96.png" sizes="96x96">
<link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<title>Bookshelf</title>
<style>
/* ═══════════════════════════════════════════════════════════════
   BOOKSHELF — design layer for Meta Ray-Ban Display (600×600 additive)
   Black is transparent glass: depth is made of light, never shadow.
   ═══════════════════════════════════════════════════════════════ */

:root {
  --bg:        #000;
  --card:      rgba(255,255,255,0.052);
  --card-hi:   rgba(201,168,76,0.11);
  --ink:       #F0EBE0;
  --ink-dim:   rgba(240,235,224,0.38);
  --ink-mid:   rgba(240,235,224,0.62);
  --gold:      #C9A84C;
  --gold-b:    rgba(201,168,76,0.45);
  --gold-glow: rgba(201,168,76,0.18);
  --divider:   rgba(255,255,255,0.06);
  --scrim:     rgba(0,0,0,0.92);
  --font:      'Noto Serif', Georgia, serif;
  --ease:      cubic-bezier(0.4,0,0.2,1);
  --ease-out:  cubic-bezier(0,0,0.2,1);

  /* Cover fields — deep, rich, tuned to stay visible as light on glass */
  --cover-ot:     #3D1420;  /* oxblood */
  --cover-nt:     #14342A;  /* forest */
  --cover-bom:    #152448;  /* the real BofM navy */
  --cover-dc:     #23272E;  /* charcoal slate */
  --cover-pgp:    #241A3E;  /* midnight purple */
  --cover-bd:     #3A2717;  /* tooled leather */
  --cover-gts:    #103537;  /* dark teal */
  --cover-family: #33241A;  /* warm dark brown */
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 600px; height: 600px;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

::-webkit-scrollbar { display: none; }
* { scrollbar-width: none; }

#app { position: relative; width: 600px; height: 600px; overflow: hidden; }

/* ───────────────────────── SCREENS ─────────────────────────
   Slide + fade, 240ms. Focus is the only cursor this UI has. */
.screen {
  position: absolute; inset: 0;
  display: none;
  flex-direction: column;
  padding: 34px 38px 26px;
  opacity: 0;
}
.screen.active {
  display: flex;
  animation: screenIn 240ms var(--ease-out) forwards;
}
@keyframes screenIn {
  from { opacity: 0; transform: translateX(14px); }
  to   { opacity: 1; transform: translateX(0); }
}

:focus { outline: none; }

/* ───────────────────────── BOOT ─────────────────────────
   The signature moment: a book alive with light, breathing
   in the dark before the wordmark arrives.               */
#boot {
  justify-content: center;
  align-items: center;
  gap: 0;
  padding: 0;
}

.book-scene {
  position: relative;
  width: 340px; height: 240px;
  display: flex; align-items: center; justify-content: center;
  perspective: 900px;
}
/* ambient candlelight behind the book, slowly breathing */
.book-scene::before {
  content: '';
  position: absolute; inset: -40px;
  background: radial-gradient(ellipse 60% 50% at 50% 55%,
              rgba(201,168,76,0.13), rgba(201,168,76,0.04) 55%, transparent 75%);
  animation: sceneBreathe 4.5s ease-in-out infinite;
  pointer-events: none;
}
@keyframes sceneBreathe {
  0%, 100% { opacity: 0.7; transform: scale(1); }
  50%      { opacity: 1;   transform: scale(1.06); }
}

.book-wrap {
  position: relative;
  width: 240px; height: 158px;
  transform: rotateX(32deg) rotateY(-6deg);
  transform-style: preserve-3d;
}

/* resting page blocks: faint parchment planes edged in gold */
.book-left, .book-right {
  position: absolute; top: 0; bottom: 0; width: 50%;
  background: linear-gradient(180deg, rgba(240,235,224,0.10), rgba(240,235,224,0.055));
  border: 1px solid rgba(240,235,224,0.10);
}
.book-left  { left: 0;  border-radius: 3px 0 0 3px; border-right: none;
              box-shadow: inset -14px 0 18px -12px rgba(0,0,0,0.8); }
.book-right { right: 0; border-radius: 0 3px 3px 0; border-left: none;
              box-shadow: inset 14px 0 18px -12px rgba(0,0,0,0.8); }

.book-spine {
  position: absolute; left: 50%; top: -2px; bottom: -2px;
  width: 2px; transform: translateX(-50%);
  background: linear-gradient(180deg, transparent, var(--gold-b) 20%, var(--gold-b) 80%, transparent);
}

/* turning pages: arc from right plane to left, catching light mid-flip */
.book-page {
  position: absolute; left: 50%; top: 2px;
  width: calc(50% - 3px); height: calc(100% - 4px);
  transform-origin: left center;
  transform-style: preserve-3d;
  animation: pgFlip 3.6s var(--ease) infinite;
  animation-delay: calc(var(--n) * 0.55s);
}
.pg-f, .pg-b {
  position: absolute; inset: 0;
  backface-visibility: hidden;
  border-radius: 0 3px 3px 0;
}
.pg-f {
  background: linear-gradient(105deg, rgba(240,235,224,0.16), rgba(240,235,224,0.08));
  border: 1px solid rgba(240,235,224,0.12);
}
.pg-b {
  background: linear-gradient(255deg, rgba(240,235,224,0.10), rgba(240,235,224,0.05));
  border: 1px solid rgba(240,235,224,0.08);
  transform: rotateY(180deg);
}
@keyframes pgFlip {
  0%      { transform: rotateY(0deg); }
  12%     { transform: rotateY(-38deg); }
  /* the moment the page face catches the light */
  38%     { transform: rotateY(-92deg); filter: brightness(1.5); }
  62%     { transform: rotateY(-148deg); filter: brightness(1); }
  74%,100%{ transform: rotateY(-178deg); }
}

/* wordmark: rule draws itself, then the name settles beneath it */
.boot-wordmark-wrap {
  margin-top: 8px;
  display: flex; flex-direction: column; align-items: center;
  gap: 12px;
}
.boot-wordmark-rule {
  width: 48px; height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  animation: ruleDraw 900ms var(--ease-out) 500ms both;
}
@keyframes ruleDraw {
  from { transform: scaleX(0); opacity: 0; }
  to   { transform: scaleX(1); opacity: 1; }
}
.boot-wordmark {
  font-size: 30px; font-weight: 400;
  letter-spacing: 0.14em;
  color: var(--ink);
  animation: bootWmFade 900ms var(--ease-out) 750ms both;
}
.boot-wordmark-sub {
  font-size: 10px;
  letter-spacing: 0.34em;
  text-transform: uppercase;
  color: var(--gold);
  padding-left: 0.34em; /* optically re-center tracked text */
  animation: bootWmFade 900ms var(--ease-out) 1000ms both;
}
@keyframes bootWmFade {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

.boot-status { margin-top: 18px; font-size: 11px; color: var(--ink-dim); letter-spacing: 0.06em; }
.boot-error {
  margin-top: 14px; max-width: 430px;
  font-size: 12px; line-height: 1.6; text-align: center;
  color: var(--ink-mid);
  border: 1px solid var(--gold-b);
  border-radius: 6px;
  padding: 12px 16px;
  background: var(--card);
}

/* ───────────────────────── SHARED CHROME ───────────────────────── */

.home-label, .section-label {
  font-size: 10px;
  letter-spacing: 0.30em;
  text-transform: uppercase;
  color: var(--gold);
}
.home-label { margin-bottom: 10px; }
.section-label { margin: 22px 2px 4px; }
.section-label:first-child { margin-top: 4px; }

.home-title, .screen-title {
  font-size: 28px; font-weight: 400;
  letter-spacing: 0.01em;
  color: var(--ink);
  margin-bottom: 22px;
}

.back-btn {
  align-self: flex-start;
  display: flex; align-items: center; gap: 5px;
  background: none; border: none;
  font-family: var(--font);
  font-size: 12.5px;
  letter-spacing: 0.04em;
  color: var(--ink-dim);
  padding: 6px 10px 6px 6px;
  margin: -6px 0 10px -6px;
  border-radius: 5px;
  border-left: 2px solid transparent;
  cursor: pointer;
  transition: color 200ms var(--ease), border-color 200ms var(--ease), background 200ms var(--ease);
}
.back-chev { font-size: 16px; line-height: 1; transform: translateY(-1px); }
.back-btn:focus {
  color: var(--gold);
  border-left-color: var(--gold);
  background: var(--gold-glow);
}

/* ───────────────────────── LIST ROWS ─────────────────────────
   Gospel Library grammar: no card boxes — quiet hairlines,
   and focus arrives as a bar of gold light on the left.     */
.card-list {
  flex: 1;
  overflow-y: auto;
  display: flex; flex-direction: column;
  padding-right: 2px;
}
.card-row {
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: space-between;
  min-height: 58px;
  padding: 0 14px;
  border-bottom: 1px solid var(--divider);
  border-left: 2px solid transparent;
  cursor: pointer;
  transition: background 200ms var(--ease), border-color 200ms var(--ease);
}
.card-row .label {
  font-size: 17px; font-weight: 400;
  color: var(--ink-mid);
  letter-spacing: 0.01em;
  transition: color 200ms var(--ease);
}
.card-row .sub {
  font-size: 11px;
  color: var(--ink-dim);
  margin-top: 3px;
  letter-spacing: 0.03em;
}
.card-row .chev {
  font-size: 18px;
  color: var(--ink-dim);
  transition: color 200ms var(--ease), transform 200ms var(--ease);
}
.card-row:focus {
  border-left-color: var(--gold);
  background: linear-gradient(90deg, var(--gold-glow), transparent 70%);
}
.card-row:focus .label { color: var(--ink); }
.card-row:focus .chev  { color: var(--gold); transform: translateX(2px); }
.card-row.empty { opacity: 0.4; }

.recents-note {
  font-size: 12px; color: var(--ink-dim);
  padding: 10px 14px; line-height: 1.6;
}

/* ───────────────────────── LIBRARY GRID ─────────────────────────
   Four shelves of portrait covers. Fallbacks are tooled leather:
   a deep color field, a fine gold frame, an embossed title.    */
.vol-grid {
  flex: 1;
  overflow-y: auto;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px 16px;
  padding: 8px 4px 16px;
  align-content: start;
}
.vol-wrap {
  display: flex; flex-direction: column; align-items: center;
  gap: 8px;
  cursor: pointer;
}
.vol-wrap.empty { opacity: 0.45; }

.vol-card {
  position: relative;
  width: 100%;
  aspect-ratio: 2 / 3;
  border-radius: 3px;
  overflow: hidden;
  background: var(--card);
  border: 1px solid rgba(240,235,224,0.10);
  transition: transform 220ms var(--ease), border-color 220ms var(--ease), box-shadow 220ms var(--ease);
}
.vol-card-img {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
}
.vol-card-fallback {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 10px;
  padding: 12px 8px;
  /* leather sheen: light falls from the top of the board */
  background-image: linear-gradient(168deg, rgba(255,255,255,0.10), rgba(255,255,255,0) 40%, rgba(0,0,0,0.28));
}
/* the tooled frame, inset like a stamped border */
.vol-card-fallback::before {
  content: '';
  position: absolute; inset: 5px;
  border: 1px solid rgba(201,168,76,0.38);
  border-radius: 2px;
  pointer-events: none;
}
.vol-card-name {
  font-size: 11px; font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  text-align: center;
  line-height: 1.5;
  color: var(--gold);
  padding: 0 6px;
  text-shadow: 0 0 8px rgba(201,168,76,0.35); /* embossed catch-light */
}
.vol-card-ornament-top, .vol-card-ornament-bot {
  width: 26px; height: 3px;
  border-top: 1px solid rgba(201,168,76,0.55);
  border-bottom: 1px solid rgba(201,168,76,0.28);
}

/* per-volume cover fields — manifest order: ot nt bom dc pgp bd gts family */
.vol-wrap:nth-child(1) .vol-card-fallback { background-color: var(--cover-ot); }
.vol-wrap:nth-child(2) .vol-card-fallback { background-color: var(--cover-nt); }
.vol-wrap:nth-child(3) .vol-card-fallback { background-color: var(--cover-bom); }
.vol-wrap:nth-child(4) .vol-card-fallback { background-color: var(--cover-dc); }
.vol-wrap:nth-child(5) .vol-card-fallback { background-color: var(--cover-pgp); }
.vol-wrap:nth-child(6) .vol-card-fallback { background-color: var(--cover-bd); }
.vol-wrap:nth-child(7) .vol-card-fallback { background-color: var(--cover-gts); }
.vol-wrap:nth-child(8) .vol-card-fallback { background-color: var(--cover-family); }

.vol-wrap:focus .vol-card {
  transform: translateY(-4px) scale(1.05);
  border-color: var(--gold-b);
  box-shadow: 0 0 0 1px var(--gold-b), 0 0 22px var(--gold-glow), 0 0 44px rgba(201,168,76,0.10);
}
.vol-label {
  font-size: 9px;
  letter-spacing: 0.06em;
  color: var(--ink-dim);
  text-align: center;
  line-height: 1.4;
  transition: color 220ms var(--ease);
}
.vol-wrap:focus .vol-label { color: var(--ink-mid); }

/* ───────────────────────── CHAPTER CHIPS ───────────────────────── */
.chip-grid {
  flex: 1;
  overflow-y: auto;
  display: flex; flex-wrap: wrap;
  gap: 12px;
  align-content: flex-start;
  padding: 4px 2px 16px;
}
.chip-grid.list-mode { flex-direction: column; flex-wrap: nowrap; gap: 0; }
.chip-grid.list-mode .card-row { width: 100%; }

.chip {
  width: 62px; height: 62px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  color: var(--ink-mid);
  background: var(--card);
  border: 1px solid rgba(240,235,224,0.08);
  border-radius: 6px;
  cursor: pointer;
  transition: color 200ms var(--ease), border-color 200ms var(--ease),
              background 200ms var(--ease), box-shadow 200ms var(--ease);
}
.chip:focus {
  color: var(--ink);
  border-color: var(--gold-b);
  background: var(--card-hi);
  box-shadow: 0 0 16px var(--gold-glow);
}
.chip.empty { opacity: 0.35; }

/* ───────────────────────── READER ─────────────────────────
   The heart of the app: a printed page made of light.     */
#reader { padding: 26px 0 0; }

.reader-header {
  display: flex; align-items: baseline;
  gap: 14px;
  padding: 0 38px 13px;
  position: relative;
}
/* hairline with a 48px gold accent at its head */
.reader-header::after {
  content: '';
  position: absolute; left: 38px; right: 38px; bottom: 0;
  height: 1px;
  background: linear-gradient(90deg, var(--gold) 0 48px, var(--divider) 48px);
}
.ref-tag {
  font-size: 11px; font-weight: 600;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--gold);
}
.verse-counter {
  font-size: 11px;
  letter-spacing: 0.08em;
  color: var(--ink-dim);
  margin-left: auto;
  font-variant-numeric: tabular-nums;
}
.bookmark-flag {
  font-size: 15px;
  color: var(--ink-dim);
  transition: color 200ms var(--ease), text-shadow 200ms var(--ease);
}
.bookmark-flag.on {
  color: var(--gold);
  text-shadow: 0 0 10px rgba(201,168,76,0.5);
}

.chapter-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 22px 46px 90px;
  scroll-behavior: smooth;
}

.chapter-header { margin-bottom: 26px; }
.chapter-book-name {
  font-size: 10px;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 8px;
}
.chapter-number-large {
  font-size: 26px; font-weight: 400;
  color: var(--ink);
  margin-bottom: 14px;
}
.chapter-heading {
  width: 48px; height: 1px;
  background: linear-gradient(90deg, var(--gold), transparent);
}
.chapter-intro {
  font-size: 20px; font-weight: 400;
  font-style: italic;
  color: var(--ink);
  line-height: 1.5;
}

.verse-row {
  padding: 7px 14px 7px 16px;
  margin: 0 -16px;
  border-left: 2px solid transparent;
  border-radius: 0 3px 3px 0;
  transition: background 220ms var(--ease), border-color 220ms var(--ease);
}
.verse-row.current {
  border-left-color: var(--gold);
  background: linear-gradient(90deg, rgba(201,168,76,0.07), rgba(201,168,76,0.015) 70%, transparent);
}
.verse-body {
  font-size: 17px;
  line-height: 1.78;
  color: var(--ink-mid);
  transition: color 220ms var(--ease);
}
.verse-row.current .verse-body { color: var(--ink); }
.verse-num {
  font-size: 10px;
  color: var(--gold);
  vertical-align: super;
  letter-spacing: 0;
  margin-right: 2px;
  opacity: 0.75;
  font-variant-numeric: tabular-nums;
}

.empty-state {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 10px;
  padding: 80px 60px;
  text-align: center;
  color: var(--ink-dim);
  font-size: 13.5px;
  line-height: 1.7;
}

/* ───────────────────────── MENU ─────────────────────────
   A held breath over the page: frosted dark, one card,
   the gold bar marking where your hand rests.           */
#menu {
  position: absolute; inset: 0;
  display: none;
  align-items: center; justify-content: center;
  background: var(--scrim);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}
#menu.active { display: flex; animation: menuIn 200ms var(--ease-out) forwards; }
@keyframes menuIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}

.menu-inner {
  width: 380px;
  background: rgba(20,18,14,0.86);
  border: 1px solid rgba(201,168,76,0.22);
  border-radius: 12px;
  padding: 22px 18px 14px;
  animation: menuCard 220ms var(--ease-out) forwards;
}
@keyframes menuCard {
  from { opacity: 0; transform: translateY(10px) scale(0.98); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.menu-header { padding: 0 8px 14px; }
.menu-header-ref {
  font-size: 22px; font-weight: 400;
  color: var(--ink);
  margin-bottom: 5px;
}
.menu-header-sub {
  font-size: 9.5px;
  letter-spacing: 0.30em;
  text-transform: uppercase;
  color: var(--gold);
}
.menu-divider {
  height: 1px;
  margin: 0 8px 10px;
  background: linear-gradient(90deg, var(--gold-b), var(--divider) 60%, transparent);
}

.menu-btn {
  width: 100%;
  display: flex; align-items: center;
  gap: 14px;
  min-height: 52px;
  padding: 0 14px;
  background: none;
  border: none;
  border-left: 2px solid transparent;
  border-radius: 0 6px 6px 0;
  font-family: var(--font);
  font-size: 15px;
  color: var(--ink-mid);
  cursor: pointer;
  text-align: left;
  transition: background 200ms var(--ease), border-color 200ms var(--ease), color 200ms var(--ease);
}
.menu-icon {
  width: 20px;
  font-size: 15px;
  text-align: center;
  color: var(--ink-dim);
  transition: color 200ms var(--ease);
}
.menu-btn:focus {
  border-left-color: var(--gold);
  background: linear-gradient(90deg, var(--gold-glow), transparent 75%);
  color: var(--ink);
}
.menu-btn:focus .menu-icon { color: var(--gold); }

/* ───────────────────────── QUALITY FLOOR ───────────────────────── */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
  .book-page { animation: none; transform: rotateY(-178deg); }
}
</style>
<body>
<div id="app">

  <!-- BOOT -->
  <section class="screen active" id="boot">
    <div class="book-scene">
      <div class="book-wrap">
        <div class="book-left"></div>
        <div class="book-spine"></div>
        <div class="book-right"></div>
        <div class="book-page" style="--n:0"><div class="pg-f"></div><div class="pg-b"></div></div>
        <div class="book-page" style="--n:1"><div class="pg-f"></div><div class="pg-b"></div></div>
        <div class="book-page" style="--n:2"><div class="pg-f"></div><div class="pg-b"></div></div>
        <div class="book-page" style="--n:3"><div class="pg-f"></div><div class="pg-b"></div></div>
        <div class="book-page" style="--n:4"><div class="pg-f"></div><div class="pg-b"></div></div>
      </div>
    </div>
    <div class="boot-wordmark-wrap">
      <div class="boot-wordmark-rule"></div>
      <div class="boot-wordmark">Library</div>
    </div>
    <div class="boot-status" id="bootStatus"></div>
  </section>

  <!-- HOME -->
  <section class="screen" id="home">
    <div class="home-title">Home</div>
    <div class="card-list">
      <div class="card-row focusable" id="homeLibrary" tabindex="0">
        <div class="label">Library</div><div class="chev">›</div>
      </div>
      <div class="card-row focusable" id="homeRecents" tabindex="0">
        <div class="label">Recents</div><div class="chev">›</div>
      </div>
    </div>
  </section>

  <!-- LIBRARY -->
  <section class="screen" id="library">
    <button class="back-btn focusable" onclick="goBack()">
      <span class="back-chev">‹</span><span>Home</span>
    </button>
    <div class="screen-title">Library</div>
    <div class="vol-grid" id="volGrid"></div>
  </section>

  <!-- RECENTS -->
  <section class="screen" id="recents">
    <button class="back-btn focusable" onclick="goBack()">
      <span class="back-chev">‹</span><span>Home</span>
    </button>
    <div class="screen-title">Recents</div>
    <div class="card-list" id="recentsList"></div>
  </section>

  <!-- BOOKS -->
  <section class="screen" id="books">
    <button class="back-btn focusable" onclick="goBack()">
      <span class="back-chev">‹</span><span id="booksBackLabel">Library</span>
    </button>
    <div class="screen-title" id="booksTitle">Books</div>
    <div class="card-list" id="booksList"></div>
  </section>

  <!-- CHAPTERS -->
  <section class="screen" id="chapters">
    <button class="back-btn focusable" onclick="goBack()">
      <span class="back-chev">‹</span><span id="chaptersBackLabel">Books</span>
    </button>
    <div class="screen-title" id="chaptersTitle">Chapters</div>
    <div class="chip-grid" id="chaptersGrid"></div>
  </section>

  <!-- READER -->
  <section class="screen" id="reader">
    <div class="reader-header">
      <div class="ref-tag" id="refTag">—</div>
      <div class="verse-counter" id="verseCounter"></div>
      <div class="bookmark-flag" id="bookmarkFlag">◇</div>
    </div>
    <div class="chapter-scroll" id="chapterScroll"></div>
  </section>

  <!-- MENU -->
  <div id="menu">
    <div class="menu-inner">
      <div class="menu-header">
        <div class="menu-header-ref" id="menuRef">—</div>
        <div class="menu-header-sub">Reading</div>
      </div>
      <div class="menu-divider"></div>
      <button class="menu-btn focusable" data-action="resume"><span class="menu-icon">↩</span>Continue reading</button>
      <button class="menu-btn focusable" data-action="bookmark"><span class="menu-icon">◇</span><span id="bookmarkLabel">Bookmark verse</span></button>
      <button class="menu-btn focusable" data-action="chapters"><span class="menu-icon">≡</span>Chapter list</button>
      <button class="menu-btn focusable" data-action="home"><span class="menu-icon">◁</span>Home</button>
    </div>
  </div>

</div>
<script>
/* ── Data ── */
const SCRIPTURES = { volumes: [] };

async function loadLibrary(){
  const statusEl = document.getElementById('bootStatus');
  try {
    const mRes = await fetch('data/manifest.json');
    if (!mRes.ok) throw new Error('manifest.json not found (' + mRes.status + ')');
    const files = await mRes.json();
    for (const file of files){
      // statusEl hidden via CSS — no visible loading text
      const res = await fetch('data/' + file);
      if (!res.ok){ console.warn('Skipping ' + file); continue; }
      SCRIPTURES.volumes.push(await res.json());
    }
    renderHome(); showScreen('home');
  } catch(err){
    statusEl.textContent = '';
    const el = document.createElement('div'); el.className = 'boot-error';
    el.textContent = 'Could not load the library (' + err.message + '). Serve over http(s) — see README.md.';
    document.getElementById('boot').appendChild(el);
  }
}

function getVolume(id){ return SCRIPTURES.volumes.find(v => v.id === id); }
function getBook(vId,bId){ return getVolume(vId).books.find(b => b.id === bId); }
function getChapter(vId,bId,num){ return getBook(vId,bId).chapters.find(c => c.num === num); }
function verseText(v){ return typeof v === 'string' ? v : v.text; }

/* ── State ── */
let nav = { volumeId:null, bookId:null, chapterNum:null, verseIdx:0 };
let menuOpen = false;
const navHistory = [];

/* ── Persistence ── */
function loadJSON(k,fb){ try{ const r=localStorage.getItem(k); return r?JSON.parse(r):fb; }catch(e){ return fb; } }
function saveJSON(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function recents()  { return loadJSON('gl_recents',[]).filter(entryStillValid); }
function bookmarks(){ return loadJSON('gl_bookmarks',[]).filter(entryStillValid); }
function entryStillValid(e){
  const vol=getVolume(e.volumeId); if(!vol) return false;
  const book=getBook(e.volumeId,e.bookId); if(!book) return false;
  return !!book.chapters.find(c=>c.num===e.chapterNum);
}
function verseKey(v,b,c,i){ return v+'|'+b+'|'+c+'|'+i; }
function touchRecent(){
  const vol=getVolume(nav.volumeId), book=getBook(nav.volumeId,nav.bookId);
  const chapter=getChapter(nav.volumeId,nav.bookId,nav.chapterNum);
  const label=chapter.title?chapter.title:(book.name+' '+nav.chapterNum);
  let list=recents().filter(r=>!(r.volumeId===nav.volumeId&&r.bookId===nav.bookId&&r.chapterNum===nav.chapterNum));
  list.unshift({volumeId:nav.volumeId,bookId:nav.bookId,chapterNum:nav.chapterNum,verseIdx:nav.verseIdx,label,volumeName:vol.name,ts:Date.now()});
  saveJSON('gl_recents',list.slice(0,6));
}
function isBookmarked(){ return bookmarks().some(b=>b.key===verseKey(nav.volumeId,nav.bookId,nav.chapterNum,nav.verseIdx)); }
function toggleBookmark(){
  const key=verseKey(nav.volumeId,nav.bookId,nav.chapterNum,nav.verseIdx);
  let list=bookmarks(); const idx=list.findIndex(b=>b.key===key);
  const book=getBook(nav.volumeId,nav.bookId);
  const chapter=getChapter(nav.volumeId,nav.bookId,nav.chapterNum);
  const label=(chapter.title?chapter.title:(book.name+' '+nav.chapterNum))+' : '+(nav.verseIdx+1);
  if(idx>=0) list.splice(idx,1);
  else list.unshift({key,volumeId:nav.volumeId,bookId:nav.bookId,chapterNum:nav.chapterNum,verseIdx:nav.verseIdx,label,ts:Date.now()});
  saveJSON('gl_bookmarks',list.slice(0,12));
  renderBookmarkFlag();
}

/* ── Navigation history ── */
function showScreen(id, push){
  if(push !== false){
    const cur = document.querySelector('.screen.active');
    if(cur && cur.id !== id) navHistory.push(cur.id);
  }
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  const first = document.getElementById(id).querySelector('.focusable');
  if(first) first.focus();
}
function goBack(){
  const prev = navHistory.pop();
  showScreen(prev || 'home', false);
}

/* ── Row builder ── */
function makeRow(label, sub, onSelect, empty){
  const row = document.createElement('div');
  row.className = 'card-row focusable' + (empty?' empty':'');
  row.tabIndex = 0;
  row.innerHTML = `<div><div class="label">${label}</div>${sub?`<div class="sub">${sub}</div>`:''}</div><div class="chev">›</div>`;
  row.addEventListener('click', onSelect);
  return row;
}

/* ── Home ── */
function renderHome(){
  document.getElementById('homeLibrary').onclick = ()=>{ renderLibrary(); showScreen('library'); };
  document.getElementById('homeRecents').onclick = ()=>{ renderRecents(); showScreen('recents'); };
}

/* ── Vol cover palette ── */
const VOL_COVERS = {
  'ot':     { bg:'#0C0C10', fg:'#C9A84C' },
  'nt':     { bg:'#0C0C10', fg:'#C9A84C' },
  'bom':    { bg:'#152448', fg:'#C9A84C' },
  'dc':     { bg:'#0C0C10', fg:'#C9A84C' },
  'pgp':    { bg:'#0C0C10', fg:'#C9A84C' },
  'bd':     { bg:'#0C0C10', fg:'#C9A84C' },
  'gts':    { bg:'#0C0C10', fg:'#C9A84C' },
  'family': { bg:'#0C0C10', fg:'#C9A84C' },
};

/* ── Library ── */
function renderLibrary(){
  const grid = document.getElementById('volGrid');
  grid.innerHTML = '';
  SCRIPTURES.volumes.forEach(v=>{
    const cover = VOL_COVERS[v.id] || { bg:'#0C0C10', fg:'#C9A84C' };
    const wrap = document.createElement('div');
    wrap.className = 'vol-wrap focusable' + (v.books.length===0?' empty':'');
    wrap.tabIndex = 0;

    const card = document.createElement('div');
    card.className = 'vol-card';
    card.style.setProperty('--cover-bg', cover.bg);
    card.style.setProperty('--cover-fg', cover.fg);

    // Cover photo image — falls back to CSS if 404
    const img = document.createElement('img');
    img.className = 'vol-card-img';
    img.src = 'covers/' + v.id + '.jpg';
    img.alt = v.name;
    img.onerror = function(){ this.style.display = 'none'; };

    // Fallback content (shown when no cover image)
    const fallback = document.createElement('div');
    fallback.className = 'vol-card-fallback';
    fallback.innerHTML = `
      <div class="vol-card-ornament-top"></div>
      <div class="vol-card-name">${v.name}</div>
      <div class="vol-card-ornament-bot"></div>
    `;

    card.appendChild(img);
    card.appendChild(fallback);

    const lbl = document.createElement('div');
    lbl.className = 'vol-label';
    lbl.textContent = v.name;

    wrap.appendChild(card);
    wrap.appendChild(lbl);
    wrap.addEventListener('click', ()=>{
      if(!v.books.length) return;
      nav.volumeId = v.id; renderBooks(); showScreen('books');
    });
    grid.appendChild(wrap);
  });
}

/* ── Recents ── */
function renderRecents(){
  const list = document.getElementById('recentsList');
  list.innerHTML = '';
  const rec = recents();
  const lbl1 = document.createElement('div'); lbl1.className='section-label'; lbl1.textContent='Continue Reading';
  list.appendChild(lbl1);
  if(rec.length){
    rec.forEach(r=>list.appendChild(makeRow(r.label, r.volumeName, ()=>{
      nav={volumeId:r.volumeId,bookId:r.bookId,chapterNum:r.chapterNum,verseIdx:r.verseIdx}; openReader();
    })));
  } else {
    const n = document.createElement('div'); n.className='recents-note';
    n.textContent = 'Chapters you open will appear here.';
    list.appendChild(n);
  }
  const bm = bookmarks();
  if(bm.length){
    const lbl2 = document.createElement('div'); lbl2.className='section-label'; lbl2.textContent='Bookmarks';
    list.appendChild(lbl2);
    bm.forEach(b=>list.appendChild(makeRow('♥ '+b.label, null, ()=>{
      nav={volumeId:b.volumeId,bookId:b.bookId,chapterNum:b.chapterNum,verseIdx:b.verseIdx}; openReader();
    })));
  }
}

/* ── Books ── */
function renderBooks(){
  const vol = getVolume(nav.volumeId);
  document.getElementById('booksTitle').textContent = vol.name;
  document.getElementById('booksBackLabel').textContent = 'Library';
  const list = document.getElementById('booksList');
  list.innerHTML = '';
  vol.books.forEach(b=>list.appendChild(makeRow(b.name, null, ()=>{
    nav.bookId = b.id; renderChapters(); showScreen('chapters');
  })));
}

/* ── Chapters ── */
function renderChapters(){
  const book = getBook(nav.volumeId, nav.bookId);
  document.getElementById('chaptersTitle').textContent = book.name;
  document.getElementById('chaptersBackLabel').textContent = getVolume(nav.volumeId).name;
  const grid = document.getElementById('chaptersGrid');
  grid.innerHTML = '';
  const hasTitles = book.chapters.some(c=>c.title);
  grid.classList.toggle('list-mode', hasTitles);
  book.chapters.forEach(c=>{
    const isEmpty = c.verses.length===0;
    const el = document.createElement('div');
    el.className = (hasTitles?'card-row':'chip') + ' focusable' + (isEmpty?' empty':'');
    el.tabIndex = 0;
    if(hasTitles) el.innerHTML=`<div><div class="label">${c.title}</div></div><div class="chev">›</div>`;
    else el.textContent = c.num;
    el.addEventListener('click',()=>{ if(isEmpty) return; nav.chapterNum=c.num; nav.verseIdx=0; openReader(); });
    grid.appendChild(el);
  });
}

/* ── Reader ── */
function openReader(){ showScreen('reader'); renderChapterContent(); }
function renderChapterContent(){
  const book = getBook(nav.volumeId, nav.bookId);
  const chapter = getChapter(nav.volumeId, nav.bookId, nav.chapterNum);
  document.getElementById('refTag').textContent = chapter.title?chapter.title:(book.name+' · '+nav.chapterNum);
  const scroll = document.getElementById('chapterScroll');
  scroll.innerHTML = '';
  if(!chapter.verses.length){
    const e = document.createElement('div'); e.className='empty-state';
    e.textContent = 'No text loaded for this chapter yet.';
    scroll.appendChild(e);
    document.getElementById('verseCounter').textContent = '';
    document.getElementById('bookmarkFlag').classList.remove('on');
    return;
  }
  const hdr = document.createElement('div');
  hdr.className = 'chapter-header';
  if(chapter.title){
    hdr.innerHTML = `<div class="chapter-intro">${chapter.title}</div>`;
  } else {
    hdr.innerHTML = `
      <div class="chapter-book-name">${book.name}</div>
      <div class="chapter-number-large">${nav.chapterNum}</div>
      <div class="chapter-heading"></div>
    `;
  }
  scroll.appendChild(hdr);

  chapter.verses.forEach((v,i)=>{
    const row = document.createElement('div');
    row.className = 'verse-row'; row.dataset.idx = i;
    row.innerHTML = `<div class="verse-body"><span class="verse-num">${i+1}</span> ${verseText(v)}</div>`;
    scroll.appendChild(row);
  });
  requestAnimationFrame(()=>updateVerseUI(false));
}
function updateVerseUI(smooth){
  const scroll = document.getElementById('chapterScroll');
  const chapter = getChapter(nav.volumeId, nav.bookId, nav.chapterNum);
  scroll.querySelectorAll('.verse-row').forEach(el=>{
    el.classList.toggle('current', parseInt(el.dataset.idx)===nav.verseIdx);
  });
  const cur = scroll.querySelector('.verse-row.current');
  if(cur) cur.scrollIntoView({block:'center',behavior:smooth?'smooth':'instant'});
  document.getElementById('verseCounter').textContent = (nav.verseIdx+1)+' / '+chapter.verses.length;
  renderBookmarkFlag(); touchRecent();
}
function renderBookmarkFlag(){
  const on = isBookmarked();
  const flag = document.getElementById('bookmarkFlag');
  flag.classList.toggle('on', on);
  flag.textContent = on ? '◆' : '◇';
  document.getElementById('bookmarkLabel').textContent = on?'Remove bookmark':'Bookmark verse';
}
function stepVerse(d){
  const ch = getChapter(nav.volumeId, nav.bookId, nav.chapterNum);
  if(!ch.verses.length) return;
  nav.verseIdx = Math.max(0, Math.min(ch.verses.length-1, nav.verseIdx+d));
  updateVerseUI(true);
}
function stepChapter(d){
  const book = getBook(nav.volumeId, nav.bookId);
  const idx = book.chapters.findIndex(c=>c.num===nav.chapterNum);
  const next = (idx+d+book.chapters.length)%book.chapters.length;
  nav.chapterNum = book.chapters[next].num; nav.verseIdx = 0;
  renderChapterContent();
}

/* ── Menu ── */
function visibleMenuBtns(){ return Array.from(document.querySelectorAll('#menu .focusable')).filter(el=>el.style.display!=='none'); }
function openMenu(){
  menuOpen = true;
  const ch = getChapter(nav.volumeId, nav.bookId, nav.chapterNum);
  const book = getBook(nav.volumeId, nav.bookId);
  const bBtn = document.querySelector('.menu-btn[data-action="bookmark"]');
  bBtn.style.display = ch.verses.length===0?'none':'flex';
  const ref = ch.title ? ch.title : book.name + ' ' + nav.chapterNum;
  document.getElementById('menuRef').textContent = ref;
  document.getElementById('menu').classList.add('active');
  const first = visibleMenuBtns()[0]; if(first) first.focus();
}
function closeMenu(){ menuOpen=false; document.getElementById('menu').classList.remove('active'); }
document.querySelectorAll('#menu .menu-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const a = btn.dataset.action;
    if(a==='resume') closeMenu();
    else if(a==='bookmark'){ toggleBookmark(); closeMenu(); }
    else if(a==='chapters'){ closeMenu(); renderChapters(); showScreen('chapters', false); }
    else if(a==='home'){ closeMenu(); navHistory.length=0; showScreen('home', false); }
  });
});

/* ── Focus helpers ── */
function visibleFocusables(scope){
  return Array.from(scope.querySelectorAll('.focusable')).filter(el=>{
    let n=el;
    while(n && n!==scope){
      if(getComputedStyle(n).display==='none') return false;
      n=n.parentElement;
    }
    return true;
  });
}

/* Group items into rows by their Y position (for 2D grid nav) */
function getGridRows(items){
  const rows = [];
  for(const item of items){
    const top = Math.round(item.getBoundingClientRect().top);
    const lastRow = rows[rows.length-1];
    if(lastRow && Math.abs(lastRow[0].getBoundingClientRect().top - top) < 10){
      lastRow.push(item);
    } else {
      rows.push([item]);
    }
  }
  return rows;
}

/* ── 2D grid move ── */
function moveInGrid(gridItems, allItems, dir){
  const cur = document.activeElement;
  const rows = getGridRows(gridItems);
  let rowIdx=-1, colIdx=-1;
  for(let r=0;r<rows.length;r++){
    const c=rows[r].indexOf(cur);
    if(c!==-1){ rowIdx=r; colIdx=c; break; }
  }
  if(rowIdx===-1){ gridItems[0].focus(); return; }

  let target = null;
  if(dir==='left'){
    if(colIdx>0) target = rows[rowIdx][colIdx-1];
    else {
      /* left edge: go to the nearest non-grid item above (back button etc.) */
      const gridStart = allItems.indexOf(gridItems[0]);
      if(gridStart>0) target = allItems[gridStart-1];
    }
  } else if(dir==='right'){
    if(colIdx < rows[rowIdx].length-1) target = rows[rowIdx][colIdx+1];
    else if(rowIdx < rows.length-1)    target = rows[rowIdx+1][0];
  } else if(dir==='up'){
    if(rowIdx>0){
      const pr = rows[rowIdx-1];
      target = pr[Math.min(colIdx, pr.length-1)];
    } else {
      const gridStart = allItems.indexOf(gridItems[0]);
      if(gridStart>0) target = allItems[gridStart-1];
    }
  } else if(dir==='down'){
    if(rowIdx < rows.length-1){
      const nr = rows[rowIdx+1];
      target = nr[Math.min(colIdx, nr.length-1)];
    }
  }

  if(target){ target.focus(); target.scrollIntoView({block:'nearest',behavior:'smooth'}); }
}

/* ── Main move focus ── */
function moveFocus(dir){
  const scope = menuOpen ? document.getElementById('menu') : document.querySelector('.screen.active');
  const items = visibleFocusables(scope);
  if(!items.length) return;

  const cur = document.activeElement;

  /* Check if in a 2D grid context */
  const volGrid  = cur.closest('.vol-grid');
  const chipGrid = cur.closest('.chip-grid:not(.list-mode)');
  const gridHost = volGrid || chipGrid;

  if(gridHost){
    const gridItems = items.filter(el=>gridHost.contains(el));
    moveInGrid(gridItems, items, dir);
    return;
  }

  /* 1D list navigation */
  const idx = items.indexOf(cur);
  if(idx===-1){ items[0].focus(); return; }
  const next = (dir==='up'||dir==='left')
    ? (idx>0 ? idx-1 : items.length-1)
    : (idx<items.length-1 ? idx+1 : 0);
  items[next].focus();
  items[next].scrollIntoView({block:'nearest',behavior:'smooth'});
}

/* ── Keyboard ── */
const DPAD = {UP:'ArrowUp',DOWN:'ArrowDown',LEFT:'ArrowLeft',RIGHT:'ArrowRight',SELECT:'Enter'};
document.addEventListener('keydown', e=>{
  const onReader = document.getElementById('reader').classList.contains('active');
  if(onReader && !menuOpen){
    switch(e.key){
      case DPAD.UP:    stepVerse(-1);   break;
      case DPAD.DOWN:  stepVerse(1);    break;
      case DPAD.LEFT:  stepChapter(-1); break;
      case DPAD.RIGHT: stepChapter(1);  break;
      case DPAD.SELECT: openMenu();     break;
      default: return;
    }
    e.preventDefault(); return;
  }
  switch(e.key){
    case DPAD.UP:    moveFocus('up');    break;
    case DPAD.DOWN:  moveFocus('down');  break;
    case DPAD.LEFT:  moveFocus('left');  break;
    case DPAD.RIGHT: moveFocus('right'); break;
    case DPAD.SELECT:
      if(document.activeElement.classList.contains('focusable')) document.activeElement.click();
      break;
    default: return;
  }
  e.preventDefault();
});

/* ── Init ── */
loadLibrary();
</script>
</body>
</html>
