<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
<meta name="description" content="Multi-path audio survival probe">
<meta name="mrbd-web-app-capable" content="yes">
<title>Audio Paths</title>
<style>
  :root { --gold:#D9B678; --ink:#F0EBE0; --dim:rgba(240,235,224,0.45); }
  * { box-sizing:border-box; }
  body { width:600px; height:600px; margin:0; overflow:hidden; background:#000; color:var(--ink);
         font-family:'Noto Serif',Georgia,serif; display:flex; flex-direction:column; padding:20px 26px; }
  h1 { font-size:15px; letter-spacing:0.1em; text-transform:uppercase; margin:0 0 2px; }
  .sub { font-size:11px; color:var(--dim); margin-bottom:10px; }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:10px; }
  .cell { border-radius:8px; background:rgba(255,255,255,0.06); padding:8px 6px; text-align:center; }
  .cell b { display:block; font-size:10px; letter-spacing:0.06em; color:var(--dim); margin-bottom:4px; }
  .cell span { font-size:15px; font-variant-numeric:tabular-nums; }
  .cell.on span  { color:#8FCf9F; }
  .cell.off span { color:#E08A7A; }
  #verdict { font-size:19px; line-height:1.45; padding:14px 16px; border-radius:10px;
             background:rgba(255,255,255,0.07); margin-bottom:10px; color:var(--dim); }
  #verdict.done { background:rgba(217,182,120,0.13); color:var(--ink); box-shadow:0 0 0 1.5px rgba(217,182,120,0.5); }
  #verdict b { color:#8FCf9F; }
  #verdict i { color:#E08A7A; font-style:normal; }
  #log { flex:1; overflow-y:auto; font-family:ui-monospace,Menlo,monospace; font-size:10.5px; line-height:1.6; }
  .ok{color:#8FCf9F;} .bad{color:#E08A7A;} .info{color:var(--dim);} .hit{color:var(--gold);}
</style>
</head>
<body>

<h1>Audio Paths</h1>
<div class="sub">Let the display sleep, then wake it. Read the verdict.</div>

<div id="verdict">waiting for a sleep/wake cycle&hellip;</div>

<div class="grid">
  <div class="cell" id="cA"><b>A · audio</b><span>—</span></div>
  <div class="cell" id="cB"><b>B · video</b><span>—</span></div>
  <div class="cell" id="cC"><b>C · webaudio</b><span>—</span></div>
  <div class="cell" id="cD"><b>D · stream</b><span>—</span></div>
</div>

<div id="log"></div>

<script>
var logEl = document.getElementById('log');
function log(m, c){
  var d = document.createElement('div');
  d.className = c || 'info';
  d.textContent = '[' + new Date().toLocaleTimeString() + '] ' + m;
  logEl.appendChild(d); logEl.scrollTop = logEl.scrollHeight;
}

/* ---------- shared tone builder ---------- */
function toneWav(seconds, rate, freq){
  var n = seconds * rate, buf = new ArrayBuffer(44 + n*2), v = new DataView(buf);
  function str(o,s){ for (var i=0;i<s.length;i++) v.setUint8(o+i, s.charCodeAt(i)); }
  str(0,'RIFF'); v.setUint32(4,36+n*2,true); str(8,'WAVE');
  str(12,'fmt '); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,rate,true); v.setUint32(28,rate*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
  str(36,'data'); v.setUint32(40,n*2,true);
  for (var i=0;i<n;i++){
    var t = i/rate, a = 0.05*Math.sin(2*Math.PI*freq*t), into = t % 3;
    if (into < 0.1) a += 0.14*Math.sin(2*Math.PI*(freq*3)*t)*(1-into/0.1);
    v.setInt16(44+i*2, Math.max(-1,Math.min(1,a))*32767, true);
  }
  return URL.createObjectURL(new Blob([buf], {type:'audio/wav'}));
}

/* ---------- A · plain <audio> ---------- */
var A = new Audio();
A.loop = true;
A.src = toneWav(20, 8000, 220);

/* ---------- B · <video> with an audio-only track ---------- */
/* Some runtimes apply a different background policy to video elements. */
var B = document.createElement('video');
B.loop = true; B.playsInline = true; B.muted = false;
B.setAttribute('playsinline',''); B.setAttribute('webkit-playsinline','');
B.style.cssText = 'position:absolute;width:2px;height:2px;opacity:0.01;pointer-events:none;';
B.src = toneWav(20, 8000, 294);
document.body.appendChild(B);

/* ---------- C · Web Audio oscillator straight to destination ---------- */
var AC = window.AudioContext || window.webkitAudioContext;
var ctx = null, oscOn = false;
function startC(){
  if (!AC) { log('C: no AudioContext', 'bad'); return; }
  if (!ctx) ctx = new AC();
  ctx.resume();
  if (oscOn) return;
  var o = ctx.createOscillator(), g = ctx.createGain();
  o.frequency.value = 370; g.gain.value = 0.05;
  o.connect(g); g.connect(ctx.destination); o.start();
  oscOn = true;
  log('C: oscillator started, ctx.state=' + ctx.state, 'ok');
}

/* ---------- D · Web Audio -> MediaStream -> <audio srcObject> ---------- */
/* MediaStream playback is sometimes treated like a call rather than media. */
var D = new Audio(); D.autoplay = true;
function startD(){
  if (!AC) return;
  if (!ctx) ctx = new AC();
  ctx.resume();
  try {
    var dest = ctx.createMediaStreamDestination();
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = 494; g.gain.value = 0.05;
    o.connect(g); g.connect(dest); o.start();
    D.srcObject = dest.stream;
    D.play().then(function(){ log('D: MediaStream playing', 'ok'); })
            .catch(function(e){ log('D: rejected ' + e.name, 'bad'); });
  } catch (e) { log('D: FAILED ' + e.message, 'bad'); }
}

/* ---------- capability ---------- */
log('--- capability ---');
log('wakeLock: ' + ('wakeLock' in navigator), 'info');
log('AudioContext: ' + !!AC, 'info');
log('createMediaStreamDestination: ' + !!(AC && AC.prototype.createMediaStreamDestination), 'info');

var wl = null;
function lock(){
  if (!('wakeLock' in navigator)) { log('no wakeLock API', 'bad'); return; }
  navigator.wakeLock.request('screen').then(function(l){
    wl = l; log('wake lock ACQUIRED', 'ok');
    l.addEventListener('release', function(){ wl = null; log('wake lock RELEASED', 'bad'); });
  }).catch(function(e){ log('wake lock failed: ' + e.name, 'bad'); });
}

/* ---------- start everything ---------- */
var started = false;
function startAll(why){
  if (started) return;
  started = true;
  log('starting all paths via ' + why, 'hit');
  lock();
  A.play().then(function(){ log('A: audio playing', 'ok'); })
          .catch(function(e){ log('A: rejected ' + e.name, 'bad'); });
  B.play().then(function(){ log('B: video playing', 'ok'); })
          .catch(function(e){ log('B: rejected ' + e.name, 'bad'); });
  startC();
  startD();
  if ('mediaSession' in navigator) {
    try {
      navigator.mediaSession.metadata = new MediaMetadata({ title:'Audio Paths', artist:'Bookshelf' });
      navigator.mediaSession.playbackState = 'playing';
    } catch(e){}
  }
}

['keydown','keyup','click','pointerdown','touchstart'].forEach(function(ev){
  document.addEventListener(ev, function(e){
    if (ev === 'keydown') log('key: ' + e.key + ' / ' + e.code);
    startAll(ev);
  });
});
startAll('autoload');

/* ---------- readouts + heartbeat ---------- */
function cell(id, alive, val){
  var el = document.getElementById(id);
  el.className = 'cell ' + (alive ? 'on' : 'off');
  el.querySelector('span').textContent = val;
}

setInterval(function(){
  cell('cA', !A.paused, A.currentTime.toFixed(0));
  cell('cB', !B.paused, B.currentTime.toFixed(0));
  cell('cC', !!(ctx && ctx.state === 'running'), ctx ? ctx.currentTime.toFixed(0) : '—');
  cell('cD', !D.paused, ctx ? ctx.currentTime.toFixed(0) : '—');
}, 300);

/* The heartbeat is the key evidence: if these lines keep appearing with a
   continuous t+ sequence, JS never stopped and only media was paused. If
   there is a gap, the whole page was suspended. */
var beat = 0;
setInterval(function(){
  beat += 5;
  log('t+' + beat + 's | A=' + (A.paused?'off':'ON') + ' ' + A.currentTime.toFixed(0)
      + ' | B=' + (B.paused?'off':'ON') + ' ' + B.currentTime.toFixed(0)
      + ' | C=' + (ctx ? ctx.state : 'none')
      + ' | D=' + (D.paused?'off':'ON')
      + ' | ' + document.visibilityState
      + ' | wl=' + (wl?'held':'no'),
      (A.paused && B.paused && D.paused) ? 'bad' : 'info');
}, 5000);

/* ---------- Verdict: one line, readable at arm's length ---------- */
var vEl = document.getElementById('verdict');
var sleptAt = null, beatsAtSleep = 0, snapshot = null;

function nowState(){
  return { A: !A.paused, B: !B.paused, C: !!(ctx && ctx.state === 'running'), D: !D.paused };
}

function renderVerdict(){
  var after = nowState();
  var survived = [], died = [];
  ['A','B','C','D'].forEach(function(k){
    if (snapshot && snapshot[k]) (after[k] ? survived : died).push(k);
  });

  var expectedBeats = Math.floor((Date.now() - sleptAt) / 5000);
  var actualBeats = beat/5 - beatsAtSleep;
  var jsRan = actualBeats >= expectedBeats * 0.6;

  var names = { A:'audio', B:'video', C:'webaudio', D:'stream' };
  var html = '';
  html += survived.length
    ? '<b>SURVIVED: ' + survived.map(function(k){ return names[k]; }).join(', ') + '</b>'
    : '<i>ALL PATHS DIED</i>';
  html += '<br>';
  html += died.length ? '<i>died: ' + died.map(function(k){ return names[k]; }).join(', ') + '</i><br>' : '';
  html += jsRan ? 'JS kept running (media policy)' : '<i>JS froze too (page suspended)</i>';
  html += '<br>slept ' + Math.round((Date.now()-sleptAt)/1000) + 's';

  vEl.innerHTML = html;
  vEl.className = 'done';
  log('VERDICT — survived: ' + (survived.join(',') || 'none')
      + ' | jsRan=' + jsRan
      + ' | beats ' + actualBeats + '/' + expectedBeats, 'hit');
}

document.addEventListener('visibilitychange', function(){
  if (document.visibilityState === 'hidden') {
    sleptAt = Date.now();
    beatsAtSleep = beat/5;
    snapshot = nowState();
    vEl.textContent = 'display asleep — wake it when ready';
    vEl.className = '';
  } else if (sleptAt) {
    renderVerdict();
  }
  log('VISIBILITY -> ' + document.visibilityState
      + ' | A=' + (A.paused?'off':'ON')
      + ' | B=' + (B.paused?'off':'ON')
      + ' | C=' + (ctx?ctx.state:'none')
      + ' | D=' + (D.paused?'off':'ON'), 'hit');
  if (document.visibilityState === 'visible' && !wl) lock();
});
window.addEventListener('freeze', function(){ log('FREEZE — page suspended', 'bad'); });
window.addEventListener('resume', function(){ log('RESUME', 'hit'); });

[['A',A],['B',B],['D',D]].forEach(function(p){
  p[1].addEventListener('pause', function(){ log(p[0] + ': PAUSED at ' + p[1].currentTime.toFixed(1) + 's', 'bad'); });
});
if (AC) {
  setInterval(function(){
    if (ctx && ctx.state !== 'running' && oscOn) log('C: ctx.state = ' + ctx.state, 'bad');
  }, 5000);
}

log('ready — all four paths starting');
</script>

</body>
</html>
