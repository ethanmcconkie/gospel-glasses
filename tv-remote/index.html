<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=600, height=600, initial-scale=1, user-scalable=no">
<title>TV Remote</title>
<style>
  :root{
    --bg:#000; --fg:#F2F4F7; --dim:#71818F;
    --sig:#FFB000; --live:#4ADE80; --rule:#232A31;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:600px;height:600px;overflow:hidden;background:var(--bg);
    color:var(--fg);font-family:system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{display:flex;flex-direction:column}

  header{display:flex;align-items:baseline;gap:12px;padding:14px 20px 10px;
    border-bottom:1px solid var(--rule)}
  .mark{font:600 13px/1 ui-monospace,monospace;letter-spacing:.22em;color:var(--dim)}
  .ctx{flex:1;font:600 20px/1 sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pulse{width:7px;height:7px;border-radius:50%;background:var(--dim)}
  .pulse.on{background:var(--live)}

  main{flex:1;position:relative;overflow:hidden;padding:20px}

  /* TV picker */
  .row{height:64px;padding:9px 16px;border-left:2px solid transparent;
    display:flex;align-items:center;gap:12px}
  .row.sel{border-left-color:var(--sig);background:rgba(255,176,0,.07)}
  .row .name{font:600 22px/1.1 sans-serif;flex:1}
  .row.sel .name{color:var(--sig)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--dim);flex:none}
  .dot.on{background:var(--live)}

  /* remote grid */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;height:100%}
  .btn{
    border:1px solid var(--rule);border-radius:12px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  }
  .btn.sel{border-color:var(--sig);background:rgba(255,176,0,.08)}
  .btn .glyph{font-size:34px;line-height:1;color:var(--fg)}
  .btn.sel .glyph{color:var(--sig)}
  .btn .lbl{font:500 14px/1 sans-serif;color:var(--dim)}
  .btn.sel .lbl{color:var(--sig)}
  .btn.full{grid-column:1 / span 2}
  .vol-readout{
    position:absolute;top:16px;right:20px;
    font:500 13px/1 ui-monospace,monospace;color:var(--dim);
  }

  footer{border-top:1px solid var(--rule);padding:9px 20px;display:flex;gap:20px;
    align-items:center;font:500 14px/1 ui-monospace,monospace;color:var(--dim)}
  kbd{color:var(--fg);font:inherit}

  .state{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:10px;text-align:center;padding:0 40px}
  .state h2{font:600 24px/1.2 sans-serif}
  .state p{font:400 18px/1.35 sans-serif;color:var(--dim)}
</style>
</head>
<body>

<header>
  <span class="mark">REMOTE</span>
  <span class="ctx" id="ctx">TVs</span>
  <span class="pulse" id="pulse"></span>
</header>
<main id="main"></main>
<footer id="foot"></footer>

<script>
(() => {
  "use strict";
  const API = "https://YOUR-PROXY-HOST";
  const POLL = 15000;

  const frag = new URLSearchParams(location.hash.slice(1));
  if (frag.get("k")) {
    localStorage.setItem("tv.key", frag.get("k"));
    history.replaceState(null, "", location.pathname);
  }
  const KEY = localStorage.getItem("tv.key");

  const HARDCODED_TV = { id: "ad2d0af8-f587-4c17-887b-fc62dd8986f4", name: "Roman" };

  let view = "remote";
  let tvs = [HARDCODED_TV];
  let sel = 0;
  let activeTV = HARDCODED_TV;
  let statusData = { power: null, volume: null, muted: false };
  let gridSel = 0;            // index into REMOTE_BUTTONS
  let timer = null;

  const $ = id => document.getElementById(id);
  const main = $("main"), foot = $("foot"), ctx = $("ctx");
  const esc = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

  // 2x3 grid, row-major. Index math for arrow nav below assumes 2 columns.
  const REMOTE_BUTTONS = [
    { id: "power_on",   glyph: "⏻", label: "Power on"  },
    { id: "power_off",  glyph: "⭘", label: "Power off" },
    { id: "volume_down",glyph: "−", label: "Volume"    },
    { id: "volume_up",  glyph: "+", label: "Volume"    },
    { id: "mute",       glyph: "🔇", label: "Mute"      },
    { id: "unmute",     glyph: "🔊", label: "Unmute"    },
  ];

  async function api(path, opts = {}) {
    const r = await fetch(API + path, { ...opts, headers: { Authorization: "Bearer " + KEY } });
    if (!r.ok) throw new Error(r.status === 401 ? "key rejected" : "proxy " + r.status);
    return r.json();
  }

  function blank(h, p) {
    main.innerHTML = `<div class="state"><h2>${esc(h)}</h2><p>${esc(p)}</p></div>`;
    foot.innerHTML = view === "remote" ? `<span><kbd>←</kbd> back to TVs</span>` : "";
  }

  function renderPicker() {
    ctx.textContent = "TVs";
    if (!KEY) return blank("No key yet", "Open this app once with #k=… on the end of the URL.");
    if (!tvs.length) return blank("No TVs found", "Nothing with power + volume showed up in SmartThings.");

    main.innerHTML = tvs.map((t, i) => `
      <div class="row${i===sel?" sel":""}">
        <span class="dot"></span>
        <span class="name">${esc(t.name)}</span>
      </div>`).join("");
    foot.innerHTML = `<span><kbd>↑↓</kbd> move</span><span><kbd>⏎</kbd> select</span>`;
  }

  function renderRemote() {
    ctx.textContent = activeTV.name;
    main.innerHTML =
      `<div class="vol-readout">${statusData.volume ?? "—"}${statusData.muted ? " · muted" : ""}</div>` +
      `<div class="grid">${REMOTE_BUTTONS.map((b, i) => `
        <div class="btn${i===gridSel?" sel":""}">
          <span class="glyph">${b.glyph}</span>
          <span class="lbl">${esc(b.label)}</span>
        </div>`).join("")}</div>`;
    foot.innerHTML = `<span><kbd>↑↓←→</kbd> move</span><span><kbd>⏎</kbd> press</span><span><kbd>back</kbd> TVs</span>`;
  }

  const draw = () => view === "picker" ? renderPicker() : renderRemote();

  async function refresh() {
    if (!KEY) return draw();
    try {
      if (view === "picker") {
        const d = await api("/tv/devices");
        tvs = d.devices;
        localStorage.setItem("tv.list", JSON.stringify(tvs));
        if (sel >= tvs.length) sel = Math.max(0, tvs.length - 1);
      } else if (activeTV) {
        statusData = await api("/tv/status/" + activeTV.id);
      }
      $("pulse").classList.add("on");
      setTimeout(() => $("pulse").classList.remove("on"), 700);
    } catch (e) {
      ctx.textContent = e.message;
    }
    draw();
  }

  async function press(action) {
    if (!activeTV) return;
    try {
      await api(`/tv/command/${activeTV.id}/${action}`, { method: "POST" });
      setTimeout(refresh, 400); // give SmartThings a beat before re-polling status
    } catch (e) {
      ctx.textContent = e.message;
    }
  }

  function openTV(tv) {
    activeTV = tv; view = "remote"; gridSel = 0;
    statusData = { power: null, volume: null, muted: false };
    draw();
    refresh();
  }

  document.addEventListener("keydown", ev => {
    const k = ev.key;
    if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Enter","Escape"].includes(k)) ev.preventDefault();

    if (view === "picker") {
      if (k === "ArrowDown" && sel < tvs.length - 1) { sel++; draw(); }
      else if (k === "ArrowUp" && sel > 0)            { sel--; draw(); }
      else if (k === "Enter" && tvs[sel])             { openTV(tvs[sel]); }
    } else {
      const cols = 2, n = REMOTE_BUTTONS.length;
      if (k === "Escape") { view = "picker"; draw(); }
      else if (k === "ArrowRight" && gridSel % cols < cols - 1 && gridSel + 1 < n) gridSel++;
      else if (k === "ArrowLeft"  && gridSel % cols > 0) gridSel--;
      else if (k === "ArrowDown"  && gridSel + cols < n) gridSel += cols;
      else if (k === "ArrowUp") {
        if (gridSel - cols >= 0) gridSel -= cols;
        else { view = "picker"; draw(); return; } // top row + up = back out
      }
      else if (k === "Enter") { press(REMOTE_BUTTONS[gridSel].id); }
      draw();
    }
  });

  function tick() {} // no clock needed on this one
  draw();
  refresh();
  timer = setInterval(refresh, POLL);

  document.addEventListener("visibilitychange", () => {
    clearInterval(timer);
    if (!document.hidden) { refresh(); timer = setInterval(refresh, POLL); }
  });
})();
</script>
</body>
</html>
