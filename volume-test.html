<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=600, height=600, initial-scale=1, user-scalable=no">
<title>Volume Test 2</title>
<style>
  body{margin:0;width:600px;height:600px;background:#000;color:#F2F4F7;
       font-family:ui-monospace,monospace;display:flex;flex-direction:column;
       align-items:center;justify-content:flex-start;padding:20px;gap:10px;
       box-sizing:border-box}
  .hit{font-size:28px;font-weight:700;color:#5BD98A;text-align:center;min-height:36px}
  .miss{color:#71818F;font-size:13px}
  .log{font-size:12px;color:#FFB000;text-align:left;width:100%;flex:1;
       overflow:hidden;white-space:pre-line;border-top:1px solid #232A31;
       padding-top:8px;margin-top:8px}
</style>
</head>
<body>
  <div class="hit" id="hit">listening…</div>
  <div class="miss">watching: keydown (all keys), MediaSession actions, gamepadconnected, devicemotion delta</div>
  <div class="log" id="log"></div>

<script>
  const logEl = document.getElementById("log");
  const hitEl = document.getElementById("hit");
  let count = 0;
  function log(msg, isHit) {
    logEl.textContent = `[${++count}] ${msg}\n` + logEl.textContent;
    if (isHit) { hitEl.textContent = "HIT: " + msg; }
  }

  // 1) Standard hardware media keys — the main hypothesis
  document.addEventListener("keydown", (e) => {
    const volumeKeys = ["AudioVolumeUp", "AudioVolumeDown", "AudioVolumeMute"];
    const isVolumeKey = volumeKeys.includes(e.key);
    log(`keydown key="${e.key}" code="${e.code}" keyCode=${e.keyCode}`, isVolumeKey);
  });

  // 2) MediaSession action handlers — register every real handler plus
  //    harmless guesses; if the shell calls one, we'll see it. Wrapped in
  //    try/catch since unsupported action names throw.
  const actions = [
    "play","pause","stop","seekbackward","seekforward","seekto",
    "previoustrack","nexttrack","skipad",
    "togglemicrophone","togglecamera","togglescreenshare",
    "setvolume","volumeup","volumedown" // non-standard guesses, harmless if unsupported
  ];
  if ("mediaSession" in navigator) {
    for (const action of actions) {
      try {
        navigator.mediaSession.setActionHandler(action, (details) => {
          log(`mediaSession action="${action}" details=${JSON.stringify(details)}`, true);
        });
      } catch (err) { /* unsupported action name, ignore */ }
    }
    navigator.mediaSession.playbackState = "playing";
    log("mediaSession handlers registered");
  } else {
    log("navigator.mediaSession not available");
  }

  // 3) Gamepad API — long shot, some browsers map hardware controls here
  window.addEventListener("gamepadconnected", (e) => {
    log(`gamepadconnected: ${e.gamepad.id}`, true);
  });

  // 4) Keep the original audio-element listener too, as a control
  const audio = new Audio(
    "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA="
  );
  audio.loop = true;
  audio.volume = 0.5;
  audio.addEventListener("volumechange", () => {
    log(`audio.volumechange volume=${audio.volume.toFixed(2)}`, true);
  });
  audio.play().catch((err) => log("play() blocked: " + err.message));

  log("ready — try pinch-and-turn now");
</script>
</body>
</html>
